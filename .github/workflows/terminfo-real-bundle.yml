name: Terminfo real-bundle replay

on:
  pull_request:
    paths:
      - 'scripts/terminfo/**'
      - 'scripts/ci/node-tests-shard.py'
      - '.github/workflows/terminfo-real-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/terminfo/**'
      - 'scripts/ci/node-tests-shard.py'
      - '.github/workflows/terminfo-real-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute required real-bundle checks with fresh pinned dependencies
        env:
          NTILDE_TERMINFO_REAL_BUNDLE_REQUIRED: '1'
        run: >-
          node --test
          scripts/terminfo/kcl-grading-collector.test.mjs
          scripts/terminfo/devq-grading-collector.test.mjs
          scripts/terminfo/mex-grading-collector.test.mjs
