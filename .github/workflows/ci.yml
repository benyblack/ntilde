          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-ubuntu-latest
          path: tests

      - name: Restore execute permissions
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            | xargs chmod +x

      - name: Restore
        run: dotnet restore

      - name: Run stress lanes
        env:
          WRITE_METRICS_ARTIFACTS: "1"
          METRICS_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/metrics
        run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --no-restore --filter "Category=Stress|Category=Performance|Category=Latency|Category=RenderMetrics" --blame-hang-timeout 8m --blame-hang-dump-type none --logger "trx;LogFileName=nightly_tab_stress.trx"

      - name: Upload nightly stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-tab-stress
          retention-days: 7
          path: |
            **/*nightly_tab_stress.trx
            artifacts/metrics/**

  aot_publish:
    name: AOT Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    # 90 rather than 40: the signed mac lane waits synchronously on Apple's
    # notarization queue inside vpk pack, which alone can run 10-30+ minutes on a
    # slow day — 40 was cutting the job down mid-wait.
    timeout-minutes: 90
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    # The secrets context is not allowed in step-level `if` (the workflow fails to
    # parse), so the signing gate is materialized here as an env boolean the macOS
    # keychain step can test. Mirrors release.yml's publish_aot.
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          path: tests

      - name: Restore
        run: dotnet restore

      # -p:SkipCliShim=true matches release.yml's Publish AOT step, and is required rather than
      # tidy. BuildCliShim invokes Ntilde.Cli out of band with -p:BuildProjectReferences=false
      # (that is what breaks the cycle - this project's build is what places the CLI beside it), and
      # the nested invocation carries no RuntimeIdentifier, so it looks for this project's reference
      # assembly at the RID-less obj/Release/net10.0/ref/. A self-contained RID publish writes its
      # intermediates under a win-x64/linux-x64/osx-arm64 subdirectory, so on a clean checkout that
      # path never exists and the nested build dies on a bare CS0006 naming it. Passing the RID down
      # does not help: the CLI references this project as an executable and then wants its apphost,
      # which a self-contained build never writes to obj. The shim is a framework-dependent artifact
      # and would be the wrong thing to embed here anyway - the AOT binary dispatches the CLI modes
      # itself (see Program.cs), which is why released bundles skip it too.
      - name: Publish AOT
        run: dotnet publish src/Ntilde.App/Ntilde.App.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:SkipCliShim=true -o artifacts/publish/${{ matrix.rid }}

      # ---- macOS packaging dry run (osx-arm64 only): the same vpk pack invocation
      # ---- release.yml runs, minus the download/upload-release steps. None of this is
      # ---- runnable from a Windows or Linux dev box, so this dispatch lane is the only
      # ---- way to verify the Ntilde.app bundle, the .pkg installer and the osx
      # ---- feed asset names BEFORE a real tag ships them. The vpk version is pinned to
      # ---- the same 1.2.0 as release.yml and Directory.Packages.props — the three must
      # ---- stay in lockstep.
      - name: Install vpk
        if: matrix.rid == 'osx-arm64'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Generate macOS app icon (.icns)
        if: matrix.rid == 'osx-arm64'
        run: packaging/macos/make-icns.sh src/Ntilde.App/Assets/ntilde_icon.png artifacts/icon/ntilde_icon.icns

      # Same secret-gated signing setup as release.yml's osx-arm64 lane (same action,
      # same gate), so this dispatch lane is also the pre-tag validation of the whole
      # codesign/notarize/staple path — not just of the unsigned packaging. When
      # MAC_CERT_P12_BASE64 is unset the step (and the flags below) is skipped and the
      # dry run packs unsigned, as it always did. See packaging/macos/README.md.
      - name: Set up macOS signing keychain
        id: mac_signing
        if: matrix.rid == 'osx-arm64' && env.MAC_SIGNING_ENABLED == 'true'
        uses: ./.github/actions/setup-mac-signing
        with:
          cert-p12-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MAC_CERT_PASSWORD }}
          sign-app-identity: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          sign-install-identity: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          notary-profile: ${{ secrets.MAC_NOTARY_PROFILE }}
          apple-id: ${{ secrets.MAC_APPLE_ID }}
          team-id: ${{ secrets.MAC_TEAM_ID }}
          app-specific-password: ${{ secrets.MAC_APP_SPECIFIC_PASSWORD }}

      # 0.0.1-ci: a dry-run version that can never collide with a real release's feed
      # (vpk rejects anything below 0.0.1, so 0.0.0-ci is not an option here).
      # Assertions mirror what release.yml asserts post-pack, so a silent vpk change
      # fails HERE rather than at the next tag.
      - name: Pack macOS bundle (Velopack dry run)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        env:
          # Signing reaches the script through env, never interpolated into its source;
          # when the keychain step was skipped these are empty and vpk stays unsigned.
          MAC_SIGNING: ${{ steps.mac_signing.outputs.imported }}
          MAC_SIGN_KEYCHAIN: ${{ steps.mac_signing.outputs.keychain }}
          MAC_SIGN_APP_IDENTITY: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          MAC_SIGN_INSTALL_IDENTITY: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          # StripSymbols=true leaves a ~94 MB Ntilde.dSYM beside the binary (3x the
          # binary's own size). Delete it at the source AND exclude it in vpk: deletion
          # keeps empty dSYM directory skeletons out of the bundle entirely, --exclude
          # (vpk's built-in default covers only .pdb) is defense-in-depth. Nothing else
          # consumes the symbols - the raw publish-dir zip this dSYM used to ship in no
          # longer exists for macOS.
          rm -rf artifacts/publish/osx-arm64/Ntilde.dSYM
          # Same secret-gated signing flags as release.yml (see its comments there);
          # the +guard keeps an empty array valid under set -u on bash 3.2.
          sign_args=()
          if [[ "${MAC_SIGNING:-}" == "1" ]]; then
            sign_args+=(
              --signAppIdentity "$MAC_SIGN_APP_IDENTITY"
              --signInstallIdentity "$MAC_SIGN_INSTALL_IDENTITY"
              --notaryProfile "$MAC_NOTARY_PROFILE"
              --keychain "$MAC_SIGN_KEYCHAIN"
            )
          fi
          vpk pack \
            --packId NtildeApp \
            --packVersion 0.0.1-ci \
            --packDir artifacts/publish/osx-arm64 \
            --mainExe Ntilde \
            --packTitle Ntilde \
            --packAuthors benyblack \
            --bundleId com.benyblack.Ntilde \
            --icon artifacts/icon/ntilde_icon.icns \
            --exclude 'Ntilde\.dSYM' \
            --outputDir artifacts/velopack-dryrun \
            ${sign_args[@]+"${sign_args[@]}"}

          echo "Velopack dry-run output:"
          ls -l artifacts/velopack-dryrun

          test -n "$(ls artifacts/velopack-dryrun/*-osx-Setup.pkg 2>/dev/null || true)" || { echo "vpk pack produced no -osx-Setup.pkg" >&2; exit 1; }
          test -n "$(ls artifacts/velopack-dryrun/*-osx-Portable.zip 2>/dev/null || true)" || { echo "vpk pack produced no -osx-Portable.zip" >&2; exit 1; }
          test -f artifacts/velopack-dryrun/NtildeApp-0.0.1-ci-osx-full.nupkg || { echo "vpk pack produced no full nupkg" >&2; exit 1; }
          test -f artifacts/velopack-dryrun/releases.osx.json || { echo "vpk pack produced no releases.osx.json" >&2; exit 1; }
          # StripSymbols leaves the dSYM beside the binary; the rm + --exclude above keep
          # it out of the bundle users download. Pin that: no dSYM entry may appear in
          # the Portable zip at all, not even an empty directory skeleton.
          #
          # THIS CHECK COULD PASS WITHOUT INSPECTING ANYTHING (#390), in the same shape the
          # linux lane's .dbg assertion was hardened out of in #386 - the long note there
          # explains it in full. The short version, because it is counter-intuitive: the
          # `set -euo pipefail` at the top of this step is NOT enough on its own. A non-zero
          # pipeline used as an `if` CONDITION is simply "false"; set -e never sees it. So
          # with unzip absent, or this zip renamed by a vpk change, the old
          #   if unzip -l <zip> | grep -q "dSYM"; then
          # went false and the step passed green having looked at nothing - while a ~94 MB
          # dSYM shipped inside the bundle users download, with a tick next to it.
          #
          # Three things prevent that now: an explicit unzip preflight, an explicit test that
          # the zip is actually there, and running unzip in a command substitution FIRST -
          # where set -e does see it fail - then matching the captured listing.
          command -v unzip >/dev/null             || { echo "unzip is not installed, so the dSYM leak assertion cannot run - do not let this check silently no-op." >&2; exit 1; }
          # Named exactly, not globbed: vpk emits the version in the nupkg name but not in
          # this one (verified against the macos-packaging-dryrun artifact), and if that ever
          # changes this must fail loudly rather than quietly inspect nothing. The sibling
          # glob assertion above would still pass on a renamed zip, so it cannot cover this.
          portable_zip=artifacts/velopack-dryrun/NtildeApp-osx-Portable.zip
          test -f "$portable_zip"             || { echo "$portable_zip is missing, so the dSYM leak assertion cannot run - vpk's output naming has changed." >&2; exit 1; }
          portable_listing="$(unzip -l "$portable_zip")"
          if grep -q "dSYM" <<<"$portable_listing"; then
            echo "Ntilde.dSYM leaked into the Portable bundle" >&2
            exit 1
          fi

      - name: Upload macOS packaging dry-run artifacts
        if: matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaging-dryrun
          retention-days: 7
          path: artifacts/velopack-dryrun

      - name: Upload AOT bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          retention-days: 7
          path: artifacts/publish/${{ matrix.rid }}

  # ===========================================================================
  # AOT regression gate (#443 follow-up). Two jobs: a cheap change detector and a
  # win-x64 NativeAOT publish that also launches the bundle it produced.
  #
  # WHY THIS EXISTS. Releases ship NativeAOT, and the failure mode that produces is
  # silent: reflection whose target ILC trimmed away throws nothing and logs nothing,
  # it just renders blank. #443 was the command palette - invisible row text in every
  # released build, correct in every dev build and every test, because those run JIT
  # with full metadata. ILC named the bug precisely, by file and line, in a warning
  # nobody read.
  #
  # Nothing in CI could have caught it. `aot_publish` above is
  # `if: github.event_name == 'workflow_dispatch'`, so no PR and no push to main has
  # ever built the AOT bundle; and the only gate that launches a real published binary
  # is the Linux packaging smoke (docker), so no Windows bundle had ever been started
  # by CI at all.
  #
  # WHY NOT JUST RELAX `aot_publish`'s `if:`. That job is a three-OS matrix whose macOS
  # leg waits synchronously on Apple's notarization queue inside `vpk pack` - hence its
  # 90-minute timeout. Running that on every PR would be absurd. This job is the narrow
  # slice worth paying for on a PR: one RID, no packaging, no signing.
  #
  # WHAT ACTUALLY FAILS THE BUILD. Not a log scan - `<WarningsAsErrors>IL2026;IL3050</>`
  # in Ntilde.App.csproj, which ILC's own targets forward as `--warnaserr`. The
  # publish step below therefore fails on a reintroduced reflection binding without this
  # workflow knowing anything about it, and so does release.yml's publish. This job's
  # contribution is *when*: on the PR, instead of on the tag.
  #
  # WHAT THE SMOKE STEP CAN AND CANNOT CATCH. It catches a bundle that cannot start:
  # XAML that fails to load, a missing native, a trimmed-away type on the startup path -
  # a broad class, and one nothing else in CI covers on Windows. It would NOT have
  # caught #443, because that needed the palette opened. Do not read a green smoke as
  # "the UI works"; the things that guard #443's actual class are the warning promotion
  # above and CompiledBindingTests.
  aot_gate_detect:
    name: AOT Gate (detect)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the diff below needs the PR's merge base, and a pull_request
          # event's default shallow checkout has no parents fetched - the diff would come
          # back empty and silently disable the gate. Same reasoning as
          # linux_packaging_detect, which this job deliberately mirrors.
          fetch-depth: 0

      # Dependency-free path filter, matching linux_packaging_detect rather than
      # introducing a third-party action this repo uses nowhere.
      #
      # Scoped by DIRECTORY, not by file extension: anything under src/ can change the
      # bundle, plus the build inputs that decide how it is compiled. The first draft of
      # this listed extensions (.axaml, .csproj) and excluded .cs, on the argument that a
      # reflection call in C# is already caught by the Roslyn analyzer on every ordinary
      # build. That argument is true and still beside the point, and review caught it: it
      # only covers the WARNING half of this gate. The smoke half - does the bundle start
      # and build its UI - answers a question no analyzer asks, and a C#-only change is
      # exactly the common case that was being skipped.
      #
      # It was also, in shape, the same mistake as the guard in #443 itself: an allowlist of
      # a hazard's known spellings catches only the known spellings, and would have gone on
      # to miss .rs (the native PTY and SSH crates the smoke step exercises), assets, and
      # anything added later. A directory rule has no such list to keep current.
      #
      # The consequence is deliberate: this now runs on nearly every PR. That is the correct
      # price for the only job that builds and starts the artifact users install, and it runs
      # in parallel with lanes of comparable length.
      - name: Detect changes that can affect AOT trimming
        id: detect
        # Values reach the script through env, never through `${{ }}` inside `run` - the
        # rule release.yml documents and linux_packaging_detect follows.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME: always runs the gate."
            exit 0
          fi
          base="$BASE_SHA"
          echo "Diffing against PR merge base: $base"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files vs merge base:"
          echo "$changed"
          # Here-string, not `echo | grep`: under pipefail a changed-file list bigger than
          # the pipe buffer makes echo take SIGPIPE, the pipeline non-zero, this `if` false,
          # and the gate skip itself SILENTLY. Same trap linux_packaging_detect calls out.
          if grep -qE '^(src/|Directory\.(Build|Packages)\.props$|global\.json$|\.github/workflows/[^/]+\.ya?ml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Production sources or build inputs changed - running the AOT gate."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under src/ or the build inputs changed - skipping the AOT gate."
          fi

  aot_gate:
    name: AOT Gate (windows-latest)
    needs: aot_gate_detect
    if: needs.aot_gate_detect.outputs.run == 'true'
    runs-on: windows-latest
    # NativeAOT's ILC pass plus the MSVC link is the bulk of this; 40 leaves room
    # without inviting a hung job to sit for an hour.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      # Deliberately the same invocation as release.yml's Publish AOT step and
      # `aot_publish`'s above, minus the output path - testing a different publish shape
      # than the one that ships would defeat the point. -p:SkipCliShim=true is required,
      # not tidy; the long comment on `aot_publish`'s Publish AOT step explains why.
      #
      # -p:TrimmerSingleWarn=false so ILC reports every offending call site instead of
      # one line per assembly. With the warning promotion in Ntilde.App.csproj, a
      # reintroduced reflection binding fails HERE, naming the .axaml line.
      - name: Publish AOT (win-x64)
        run: dotnet publish src/Ntilde.App/Ntilde.App.csproj -c ${{ env.CONFIGURATION }} -r win-x64 --self-contained true -p:PublishAot=true -p:SkipCliShim=true -p:TrimmerSingleWarn=false -o artifacts/publish/win-x64

      # Start the bundle CI has never started. NTILDE_APPDATA_ROOT points the app at an
      # empty directory, so this runs from a pristine profile - no settings.json, no
      # themes, no session to restore. That is deliberately the condition #443 was
      # reported from ("installed the latest release on a new windows machine"), and it is
      # the state least covered by tests, which always construct their own settings.
      #
      # "The process is alive" alone is weak - a managed startup failure is caught by
      # Program.cs, which logs it, writes logs/startup_error.txt and rethrows - so the step
      # asserts four things, each catching a different shape: no startup_error.txt, a live
      # process, a Build: line proving managed Main got through startup, and a themed
      # terminal view proving the UI itself came up. The last one is the half that matters
      # for a trimming break, which typically survives startup and dies when the UI is
      # constructed.
      - name: Smoke launch the published bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ntilde-smoke-profile'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:NTILDE_APPDATA_ROOT = $root
          $errorFile = Join-Path $root 'logs/startup_error.txt'
          $debugLog  = Join-Path $root 'logs/debug.log'

          $exe = Join-Path $PWD 'artifacts/publish/win-x64/Ntilde.exe'
          if (-not (Test-Path $exe)) { throw "The publish produced no Ntilde.exe at $exe." }

          $proc = Start-Process -FilePath $exe -PassThru
          Write-Output "Started pid $($proc.Id); watching for 45s."

          # Poll rather than sleep-then-look, so a fast crash is reported as a crash
          # instead of waiting out the full window first.
          $deadline = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited -or (Test-Path $errorFile)) { break }
            Start-Sleep -Seconds 2
          }

          # Diagnostics BEFORE the assertions: whatever the outcome, the log is what a
          # human needs, and an assertion that throws first would take it away.
          foreach ($f in @($debugLog, $errorFile)) {
            if (Test-Path $f) {
              Write-Output "---- $f ----"
              Get-Content $f -Tail 60
            }
          }

          if (Test-Path $errorFile) {
            throw "The bundle failed during startup and wrote startup_error.txt (contents above). Read the exception before retrying: a trimmed-away type or a missing native is a real AOT break and reruns will not clear it. The one environmental cause to rule out is the runner being unable to host a desktop window at all, which shows up as an Avalonia/windowing exception on StartWithClassicDesktopLifetime rather than as anything about types or files."
          }
          if ($proc.HasExited) {
            throw "The bundle exited on its own within 45s (exit code $($proc.ExitCode)) without writing startup_error.txt, so it died outside Program.cs's own try/catch - suspect the native side or the host."
          }
          if (-not (Test-Path $debugLog)) {
            throw "The process is alive but never wrote $debugLog, so managed Main did not reach its startup logging. Suspect a failure before the log sink is wired, in the AOT host itself."
          }

          # Program.cs logs three lines at startup, and this asserts on the THIRD, not the
          # first. The first ("Ntilde started with args: ...") never reaches the file -
          # not in CI and not in a local install either - so the obvious assertion is a
          # guaranteed false failure. That is its own bug, worth fixing separately; it is not
          # this gate's job to depend on it.
          #
          # Build: is the better anchor anyway. It proves managed Main got through its startup
          # sequence, and it proves DescribeBuild resolved the executable path - the one
          # remaining IL3000 in the tree is Assembly.Location in that very method, and
          # `path=...Ntilde.exe` appearing here is the standing proof that
          # Environment.ProcessPath carries it and the warned fallback never runs.
          if (-not (Select-String -Path $debugLog -Pattern 'Build:.*path=.*Ntilde\.exe' -Quiet)) {
            throw "$debugLog carries no 'Build: ... path=...Ntilde.exe' line. Either managed Main did not reach its startup logging, or DescribeBuild could not resolve the executable path - which in an AOT bundle means Environment.ProcessPath came back empty and the Assembly.Location fallback (IL3000) was reached after all."
          }

          # One assertion beyond "Main ran": the window and a terminal view actually came up.
          # This is the half that matters for a trimming break, which typically survives startup
          # and dies when the UI is constructed. Both lines are emitted on a pristine profile -
          # the default pane is created and themed before anything is interactive.
          #
          # If a log-message reword breaks this, re-anchor it to whatever the renderer now says
          # on first paint. Do not delete the check: without it this step only proves the
          # process launched, which the palette bug did too.
          #
          # `Spawned ... pid=<n>` rather than the `Spawning` line this step first shipped with:
          # RustPtySession logs `Spawning` BEFORE calling pty_spawn, so a PTY that fails to
          # spawn writes it anyway and then throws into TerminalPane.InitializeSessionCore's
          # catch, which shows an error banner and leaves the process alive and themed - all
          # four assertions green over a terminal that cannot open a shell. `Spawned` is
          # emitted after the IsInvalid check and carries the child pid, so it is only
          # reachable with a real session behind it. (Codex P1 on #445.)
          foreach ($pattern in @('\[TerminalView\] Theme applied', '\[RustPtySession\] Spawned .*pid=\d+')) {
            if (-not (Select-String -Path $debugLog -Pattern $pattern -Quiet)) {
              throw "$debugLog has no line matching '$pattern', so the bundle started but its UI never finished coming up. A trimmed-away type reached only while building the terminal view looks exactly like this."
            }
          }

          Write-Output "Bundle started from a pristine profile, brought up its UI, and stayed up."
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      # The logs are the whole diagnostic value when this job fails, and a failed GUI
      # launch on a runner is exactly the case nobody can reproduce locally.
      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aot-gate-smoke-logs
          retention-days: 7
          path: ${{ runner.temp }}/ntilde-smoke-profile/logs
          if-no-files-found: ignore

  # ===========================================================================
  # Linux packaging: dry run + smoke gate (#91 Linux leg). Two callers of the same
  # scripts release.yml uses, so packaging breaks land on a PR rather than on a tag.
  #
  # THREE jobs, not one, and the split is load-bearing - read this before merging
  # them back together.
  #
  # 1. `linux_packaging_detect` (runner, no container): the change-detection gate.
  #    Cheap, needs `git` + full history, and its output gates the other two.
  # 2. `linux_packaging_build` (runner + `container: ubuntu:22.04`): everything that
  #    produces artifacts - cargo, AOT publish, build-deb.sh, vpk pack, assertions.
  # 3. `linux_packaging_smoke` (runner, no container): the docker-based gates -
  #    test-build-deb.sh and smoke-test.sh - consuming job 2's artifacts.
  #
  # WHY A CONTAINER AT ALL. NativeAOT links against the build machine's glibc with
  # no runtime fallback, so whatever builds the binary IS the minimum supported
  # distro. This lane used `runs-on: ubuntu-22.04` to pin that floor at glibc 2.35
  # (Ubuntu 22.04+, Debian 12+, Fedora 36+). But actions/runner-images#14254
  # deprecates the ubuntu-22.04 image starting 2026-09-17 (fully unsupported
  # 2027-04-17), which would have retired our glibc floor on GitHub's schedule
  # rather than ours. `runs-on: ubuntu-latest` + `container: ubuntu:22.04` pins the
  # floor to an image tag we control, permanently and independently of the runner
  # lifecycle. Bumping the floor is now a deliberate one-line edit here.
  #
  # WHY THE SMOKE GATE CANNOT BE IN THE CONTAINER. smoke-test.sh and
  # test-build-deb.sh both `docker run` bare containers themselves - that is the
  # entire design premise of the smoke test (a pristine machine that installs
  # nothing but the .deb). A `container:` job has no docker daemon and no socket, so
  # docker-in-docker is not available; mounting the host socket would be a
  # privilege escalation and would also break the `-v "$PWD:..."` mounts, because
  # paths inside the job container do not exist on the daemon's host. So the smoke
  # gate stays on the runner, where a daemon exists, and receives the artifacts via
  # upload/download-artifact. The gate is NOT dropped or weakened - it runs exactly
  # the same two scripts against exactly the artifacts job 2 produced.
  #
  # Artifact permissions are not preserved by upload/download-artifact. That is
  # harmless here: the .deb carries its own internal modes in its data tarball, and
  # smoke-test.sh already does `cp "$img" /tmp/ntilde.AppImage && chmod +x` before
  # launching an AppImage.
  #
  # x64 only: this lane exists to catch asset-naming and layout mistakes, which are
  # architecture-independent. release.yml covers arm64.
  # ===========================================================================
  #
  # This lane is deliberately NOT gated by a workflow-level `paths:` filter - that
  # would gate every other job in this file, and the `pull_request` trigger above
  # only has `paths-ignore`. Instead this job's `if:` stays event-based (always
  # eligible to run) and publishes a `run` output that gates the two expensive jobs:
  # workflow_dispatch is always a full dry run, push (to main, per the trigger above
  # - i.e. a post-merge run, not every commit) always runs fully too as a cheap
  # post-merge canary, and pull_request only runs fully when the diff against the
  # PR's merge base touches packaging/linux/** or a workflow file - otherwise the
  # ~40-minute AOT/build/smoke work never starts.
  #
  # This job replaces the per-step `if: steps.detect.outputs.run == 'true'` guards
  # the single-job version used. A job output is the only way to share the decision
  # across jobs, and it gives a truer run summary too: the expensive jobs now show
  # as "skipped" rather than as a green job of skipped steps. A failure INSIDE this
  # job still reds the workflow, same as the old failing detect step did.
  linux_packaging_detect:
    name: Linux Packaging (detect)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) checkout: the change-
          # detection step below needs `git diff` against the PR's merge base, and
          # for a pull_request event the default checkout is the merge commit with
          # no parents fetched. A shallow checkout would make that diff wrong or
          # empty - silently disabling the PR gate this job exists to provide.
          fetch-depth: 0

      # Dependency-free path filter (no third-party action - this repo uses none
      # for path filtering elsewhere). workflow_dispatch and push always run the
      # full job; pull_request only runs it when the diff against the PR's merge
      # base touches packaging/linux/** or packaging/arch/**, a workflow file, or one
      # of the two other inputs build-deb.sh reads directly (LICENSE, the app icon) -
      # a change to either would otherwise land invisibly, since neither lives under
      # packaging/linux/.
      #
      # ONE detect job gates BOTH packaging lanes, deliberately. build-arch.sh reads
      # build-deb.sh's dlopen table (that is the mechanism keeping the two dependency
      # lists from drifting), so a change to either lane can break the other and both
      # must run. A second, arch-only detect job would have to re-state that coupling
      # and could then disagree with this one.
      - name: Detect packaging changes
        id: detect
        # Both values reach the script through env, never through `${{ }}` inside the
        # `run` block. Neither is attacker-controlled (github.event_name is a fixed
        # vocabulary, and base.sha is a 40-char hex the forge computes), so this is not
        # closing a live injection - it is the env-only rule release.yml already
        # documents and enforces for `run` inputs, applied here so the newest job is
        # not the one exception someone later cites as precedent.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME: always runs the full job."
            exit 0
          fi
          base="$BASE_SHA"
          echo "Diffing against PR merge base: $base"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files vs merge base:"
          echo "$changed"
          # <<< the here-string, not `echo ... | grep`: under pipefail, a changed-file
          # list exceeding the pipe buffer would make `echo` take SIGPIPE, the
          # pipeline non-zero, this `if` false, and the job skip itself SILENTLY -
          # the exact failure class this gate exists to prevent. smoke-test.sh and
          # build-deb.sh both avoid the same construct for the same reason.
          if grep -qE '^(packaging/(linux|arch)/|\.github/workflows/[^/]+\.ya?ml$|LICENSE$|src/Ntilde\.App/Assets/ntilde_icon\.png$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Packaging or workflow files changed - running the full job."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No packaging/linux or workflow changes detected - skipping the packaging build."
          fi

  linux_packaging_build:
    name: Linux Packaging (dry run)
    needs: linux_packaging_detect
    if: needs.linux_packaging_detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The glibc floor. See the block comment above - this tag, not the runner
    # image, is what defines the minimum distro Ntilde's Linux build
    # supports. Do not bump it without deciding to drop a distro.
    container:
      image: ubuntu:22.04
    # THE FIX for the first real CI failure of this lane: inside a `container:`
    # job GitHub does NOT default the shell to bash the way it does on a plain
    # runner - it invokes the inline `run:` blocks under `sh`, which on this
    # image is dash. Every step below opens with `set -euo pipefail`, and dash
    # has no `pipefail` option at all ("set: Illegal option -o pipefail"), so
    # the very first step failed on line 1 before anything else ran. Every local
    # verification of this recipe used `docker run ... bash -c '...'` explicitly,
    # so this gap was invisible until GitHub picked the shell itself. Declaring
    # the job-level default is the systemic fix - it also covers the `<<<`
    # here-strings and other bash-only constructs used later in this job's
    # `run:` blocks, none of which dash supports either.
    defaults:
      run:
        shell: bash
    # 40 -> 60: uncached cargo (two crates) + full NuGet restore + AOT publish +
    # vpk pack, cold, plus - new with the container - an SDK download and an
    # apt-install of the entire toolchain on every run that misses the caches.
    # aot_publish needed the same kind of bump (40 -> 90) for a lighter workload.
    # This is a capacity estimate for a cold job, not a flake being papered over -
    # if it ever flakes AFTER caching, that is a hypothesis to investigate, not a
    # number to bump again.
    timeout-minutes: 60
    steps:
      # MUST be the first step, before actions/checkout: a bare ubuntu:22.04 has
      # no git, and actions/checkout silently falls back to a tarball download via
      # the REST API when git is absent - which produces no `.git` at all, so
      # `fetch-depth` and anything git-shaped downstream would be meaningless.
      #
      # Everything the pipeline needs is installed explicitly. A bare image has
      # almost nothing, and this job's standing philosophy ("relying on image
      # contents is what breaks when the image rolls") is now not a philosophy but
      # a hard requirement:
      #   ca-certificates curl  - the SDK/rustup downloads, TLS for both
      #   git                   - actions/checkout (see above)
      #   jq                    - reads sdk.version out of global.json for the
      #                           checksum-verified SDK install below. Parsing it
      #                           with sed would have to skip global.json's two "//"
      #                           comment keys, whose values mention version numbers
      #                           of their own; jq cannot confuse a comment for the
      #                           pin. release.yml's equivalent job already installs
      #                           it for its prior-release query.
      #   unzip                 - the nupkg .dbg leak assertion below
      #   zstd, tar, gzip       - actions/cache's archive backends (tar/gzip are in
      #                           the base image; zstd is not, and cache silently
      #                           degrades to gzip without it)
      #   clang zlib1g-dev      - the NativeAOT link step (documented prerequisites)
      #   binutils              - `strip`, which build-deb.sh preflights and fails
      #                           loudly without
      #   file                  - build-deb.sh's ELF discovery for Depends: walking
      #   imagemagick           - `convert`, for the hicolor icon set
      #   squashfs-tools        - `mksquashfs`. vpk pack builds a type-2 AppImage
      #                           and CANNOT produce one without it; a bare
      #                           ubuntu:22.04 does not ship it, and the local
      #                           end-to-end only ever produced an AppImage once it
      #                           was installed. Not optional.
      #   fontconfig libfreetype6 x11-utils
      #                         - build-deb.sh's Depends: derivation walks ldd
      #                           against whatever is ALREADY resolvable on this
      #                           machine, so leaving these implicit makes the
      #                           derived set a function of imagemagick's own
      #                           dependency graph on whichever apt snapshot is
      #                           current - which is exactly how a 24.04 run and a
      #                           22.04 run produced two different transitive sets
      #                           from identical binaries. Declaring them makes it a
      #                           function of this list instead.
      #   libicu70 libssl3      - the .NET SDK's own runtime prerequisites on 22.04
      - name: Install container toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            ca-certificates curl git unzip zstd jq \
            clang zlib1g-dev binutils file imagemagick squashfs-tools \
            fontconfig libfreetype6 x11-utils \
            libicu70 libssl3
          echo "--- container identity (the glibc floor this lane pins) ---"
          # Read the file directly / capture-then-select-one-line, not `| head`:
          # `head` closes its end of the pipe once it has read enough, so the
          # writer (cat, or here ldd's own multi-echo version script) can take
          # SIGPIPE and turn this purely-informational step red under
          # `pipefail` - exactly what happened in CI run 33669171961. `head -2
          # /etc/os-release` reads the file directly, no pipe at all. `ldd
          # --version` has no file to read from, so its output is captured
          # first and `sed` selects line 1 from the already-complete string -
          # sed here never has an upstream process to starve.
          head -2 /etc/os-release
          sed -n '1p' <<<"$(ldd --version)"

      - uses: actions/checkout@v4

      # Cache the SDK payload itself, keyed on global.json: the SDK tarball is a
      # ~220 MB download on every cold run, and unlike the runner image the
      # container has no preinstalled SDK to fall back on. The install step below
      # skips the download when $HOME/.dotnet/sdk/<version> is already there, so a
      # cache hit costs nothing.
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-container-ubuntu2204-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-container-ubuntu2204-

      # actions/setup-dotnet is deliberately NOT used here. It is a node action
      # that shells out to dotnet-install.sh, so it would add a layer whose
      # behaviour inside a bare container is unproven, to gain only the
      # `cache: true` NuGet cache - which is one actions/cache block below.
      #
      # dotnet-install.sh is not used either, and that IS a change: this step used
      # to `curl` it from the dot.net redirector and execute it. Transport was
      # hardened (`--proto '=https' --tlsv1.2`) but the content never was - so this
      # lane executed mutable remote script content before compiling the artifacts
      # users install, which is precisely the property the pinned+checksummed rustup
      # bootstrap below was changed to remove. Doing it here too: fetch the SDK
      # tarball and its published .sha512 sidecar, verify, then extract. Nothing
      # downloaded is executed before it has been verified.
      #
      # The version is READ OUT OF global.json (jq), never a literal, so this cannot
      # drift from the pin the win/osx jobs get via setup-dotnet's global-json-file
      # input - that was the whole reason the old code passed `--jsonfile global.json`.
      # Behaviour difference worth stating: dotnet-install.sh --jsonfile honoured
      # `rollForward: latestPatch` and could therefore install a NEWER 10.0.4xx patch
      # than the pin names, while this installs exactly `sdk.version`. That is
      # strictly more reproducible, matches the actions/cache key (which is
      # hashFiles('global.json')), and global.json's rollForward still governs which
      # installed SDK `dotnet build` selects.
      #
      # Per-arch by `uname -m`, so this runs unchanged on an arm64 leg. An
      # unrecognised architecture is a hard error, not a silent fallthrough.
      - name: Install .NET SDK (version pinned by global.json)
        run: |
          set -euo pipefail
          sdk_version="$(jq -re '.sdk.version' global.json)"
          case "$(uname -m)" in
            x86_64)  sdk_rid=linux-x64 ;;
            aarch64) sdk_rid=linux-arm64 ;;
            *) echo "no pinned .NET SDK download for architecture $(uname -m)" >&2; exit 1 ;;
          esac
          tarball="dotnet-sdk-${sdk_version}-${sdk_rid}.tar.gz"
          base_url="https://builds.dotnet.microsoft.com/dotnet/Sdk/${sdk_version}"
          if [[ -d "$HOME/.dotnet/sdk/$sdk_version" ]]; then
            # actions/cache above restored it; the old script self-no-opped here.
            echo "SDK $sdk_version already present in \$HOME/.dotnet (cache hit); skipping download"
          else
            curl --proto '=https' --tlsv1.2 -sSfL -o "/tmp/$tarball"        "$base_url/$tarball"
            curl --proto '=https' --tlsv1.2 -sSfL -o "/tmp/$tarball.sha512" "$base_url/$tarball.sha512"
            # NOT `sha512sum -c`: the sidecar's shape is not contractual across
            # .NET's download hosts. builds.dotnet.microsoft.com currently serves the
            # two-column "<hash>  <filename>" form, but the older dotnetcli.* CDN
            # sidecars are a BARE hash with no filename, which `sha512sum -c` rejects
            # outright ("no properly formatted checksum lines found"). Taking field 1
            # of line 1 reads both shapes; the hex-digest assertion is what stops it
            # from quietly accepting an error page, a truncated body or an empty file
            # instead - without it, a garbage sidecar would compare unequal for the
            # wrong reason, or (if empty) not compare at all.
            expected="$(awk 'NR==1 { print tolower($1) }' "/tmp/$tarball.sha512")"
            [[ "$expected" =~ ^[0-9a-f]{128}$ ]] \
              || { echo "::error::$tarball.sha512 is not a SHA-512 hex digest (got '${expected:0:80}') - refusing to install an unverified SDK" >&2; exit 1; }
            actual="$(sha512sum "/tmp/$tarball" | awk '{ print tolower($1) }')"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::sha512 mismatch for $tarball" >&2
              echo "  expected: $expected" >&2
              echo "  actual:   $actual" >&2
              exit 1
            fi
            echo "sha512 verified for $tarball: $actual"
            mkdir -p "$HOME/.dotnet"
            tar -xzf "/tmp/$tarball" -C "$HOME/.dotnet"
            # A verified tarball of the wrong SHAPE would otherwise leave a $HOME
            # /.dotnet that PATH points at and nothing in it, failing later with a
            # confusing "dotnet: not found" instead of here.
            [[ -x "$HOME/.dotnet/dotnet" && -d "$HOME/.dotnet/sdk/$sdk_version" ]] \
              || { echo "::error::extracted SDK has no dotnet/sdk/$sdk_version - wrong payload shape" >&2; exit 1; }
          fi
          # Both entries: `dotnet` itself, and the global-tool shim dir that
          # `dotnet tool install -g vpk` writes into. Neither is on PATH in a
          # container, unlike on the hosted runner image.
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Verify dotnet is on PATH
        run: |
          set -euo pipefail
          command -v dotnet
          dotnet --version

      # setup-dotnet's `cache: true` (used by the other jobs in this file) is not
      # available without setup-dotnet, so the NuGet package cache is declared
      # directly with the same dependency path it would have used.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-container-ubuntu2204-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-container-ubuntu2204-

      # dtolnay/rust-toolchain@stable is not used here: it drives an EXISTING
      # rustup, which the hosted runner image preinstalls and a bare
      # ubuntu:22.04 does not. Same intent, via the upstream installer.
      #
      # The upstream installer is NOT invoked as `curl https://sh.rustup.rs | sh`,
      # though: this pipeline produces artifacts end users install, and a release
      # pipeline should not execute an unverified script fetched through a
      # redirector. Instead: download a version-pinned rustup-init for this
      # container's own architecture, verify it against rustup's published
      # SHA256 before executing anything, then run the verified binary.
      # RUSTUP_VERSION is pinned in a variable (not buried in a URL) so the pin
      # is visible and trivial to bump. `uname -m` maps directly onto the
      # "<arch>-unknown-linux-gnu" triple name for both x86_64 and aarch64, so
      # no per-arch branch is needed - this runs unchanged on the
      # ubuntu-24.04-arm leg.
      - name: Install Rust
        run: |
          set -euo pipefail
          RUSTUP_VERSION=1.29.1
          triple="$(uname -m)-unknown-linux-gnu"
          base_url="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${triple}"
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init "${base_url}/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init.sha256 "${base_url}/rustup-init.sha256"
          (cd /tmp && sha256sum -c rustup-init.sha256)
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Verify cargo is on PATH
        run: |
          set -euo pipefail
          command -v cargo
          cargo --version
          rustc --version

      # Kept as-is: a node action, so it runs in the container, and it only needs
      # cargo on PATH - which the step above put there via $GITHUB_PATH.
      - name: Rust incremental build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/Ntilde.App/native

      - name: Build Rust native
        run: |
          cd src/Ntilde.App/native
          cargo build --release --locked
          mkdir -p target_linux/release
          cp target/release/librusty_pty.so target_linux/release/
          cd rusty_ssh && cargo build --release --locked

      - name: Restore
        run: dotnet restore

      # -p:SkipCliShim=true for the same reason as release.yml's Publish AOT: the
      # shim needs a RID-less framework-dependent build, and the AOT binary
      # dispatches the CLI modes itself.
      - name: Publish AOT (linux-x64)
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: >-
          dotnet publish src/Ntilde.App/Ntilde.App.csproj
          -c ${{ env.CONFIGURATION }} -r linux-x64 --self-contained true
          -p:PublishAot=true -p:SkipCliShim=true
          -p:Version=0.0.1-ci -p:InformationalVersion=0.0.1-ci
          -o artifacts/publish/linux-x64

      - name: Build .deb
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/build-deb.sh artifacts/publish/linux-x64 0.0.1-ci amd64 artifacts/linux

      # Recorded, not asserted: the derived Depends: is a function of what is
      # installed on the machine doing the packaging (see the toolchain step's
      # note on fontconfig), so printing it makes an image-driven change visible
      # in the log instead of only showing up as a smoke-test failure.
      - name: Show derived Depends
        run: dpkg-deb -f artifacts/linux/ntilde_0.0.1~ci-1_amd64.deb Depends

      # vpk pinned to 1.2.0, in lockstep with Directory.Packages.props and the two
      # other install sites in these workflows.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      # --channel linux-x64, NOT the platform default 'linux'. Linux publishes two
      # architectures into one GitHub release, and a Velopack feed is per-channel,
      # not per-architecture, so a shared 'linux' channel would offer an arm64
      # client an x64 package. Must match VelopackUpdateService.ResolveExplicitChannel.
      #
      # 0.0.1-ci because vpk rejects anything below 0.0.1. No --delta concerns here:
      # there is no prior release in this scratch output directory, so a full-only
      # pack is expected and correct for a dry run.
      # StripSymbols=true (Ntilde.App.csproj) emits a ~79 MB Ntilde.dbg
      # beside the AOT binary on Linux - the same class of leak the macOS lane
      # already guards against for its dSYM (delete at the source AND --exclude in
      # the pack, see that job's comments). build-deb.sh already deletes *.dbg
      # before staging the .deb, so only this AppImage/nupkg path was exposed:
      # every full-nupkg download was roughly tripling, silently, and Task 5 was
      # about to copy this exact invocation into the real release lane.
      #
      # One --exclude, not two: `vpk pack --help` documents it as a single REGEX
      # value ("[default: .*\.pdb]"), so both patterns are combined into one
      # alternation rather than passed twice (unverified whether a second
      # occurrence would error or silently overwrite the first - not worth finding
      # out on the release-lane-adjacent invocation).
      #
      # mksquashfs (squashfs-tools, installed above) is a hard prerequisite of this
      # step - a type-2 AppImage IS a squashfs image.
      - name: Pack AppImage (Velopack)
        run: |
          rm -f artifacts/publish/linux-x64/*.pdb artifacts/publish/linux-x64/*.dbg
          vpk pack \
            --packId NtildeApp \
            --packVersion 0.0.1-ci \
            --packDir artifacts/publish/linux-x64 \
            --mainExe Ntilde \
            --packTitle Ntilde \
            --packAuthors benyblack \
            --channel linux-x64 \
            --icon src/Ntilde.App/Assets/ntilde_icon.png \
            --exclude '.*\.pdb|Ntilde\.dbg' \
            --outputDir artifacts/linux

      # Mirrors release.yml's post-pack assertions, so a silent vpk behaviour change
      # surfaces here instead of on a tag. The `~` in the .deb filename is the
      # prerelease mapping from build-deb.sh - asserting it here pins that behaviour.
      - name: Assert expected assets
        run: |
          # set -euo pipefail is not the default here: GitHub runs `bash -e {0}`, with
          # neither `pipefail` nor `nounset`. Without pipefail a failing left-hand side
          # of the `unzip | grep` below was invisible - see the leak assertion's own
          # comment at the bottom of this step.
          set -euo pipefail
          cd artifacts/linux
          ls -la
          test -n "$(ls ./*.AppImage 2>/dev/null)" || { echo "vpk pack produced no .AppImage" >&2; exit 1; }
          test -f ntilde_0.0.1~ci-1_amd64.deb || { echo "no .deb (or wrong prerelease version mapping)" >&2; exit 1; }
          test -f NtildeApp-0.0.1-ci-linux-x64-full.nupkg || { echo "no linux-x64 full nupkg" >&2; exit 1; }
          test -f releases.linux-x64.json || { echo "no releases.linux-x64.json" >&2; exit 1; }
          dpkg-deb --contents ntilde_0.0.1~ci-1_amd64.deb
          # StripSymbols leaves Ntilde.dbg beside the binary; the rm + --exclude
          # in the Pack step above keep it out of what users/updaters download. Pin
          # that here too: no .dbg entry may appear in the full nupkg at all - a
          # .nupkg is a plain zip, so this mirrors the macOS lane's dSYM leak
          # assertion against its Portable.zip exactly.
          #
          # THIS CHECK USED TO BE ABLE TO PASS WITHOUT CHECKING ANYTHING, and the shape
          # it used is the reason - do not revert to it. It was
          #   if unzip -l <nupkg> | grep -q '\.dbg'; then ... fi
          # and GitHub's default shell is `bash -e {0}` with NO pipefail. So with `unzip`
          # absent - one edit to the apt list above away - the pipeline's status is
          # `grep`'s, which is 1 on empty input; a non-zero status in an `if` CONDITION
          # does not trip `set -e`; the `if` simply went false and the step passed green
          # having inspected nothing. Three things now make that impossible:
          #   1. `set -euo pipefail` at the top of the step,
          #   2. an explicit `command -v unzip` preflight (pipefail alone is NOT enough -
          #      a non-zero pipeline inside an `if` condition is still just "false"),
          #   3. running unzip in a command substitution FIRST, where `set -e` does see
          #      its failure, and grepping the captured listing via a here-string (also
          #      avoiding the SIGPIPE-on-large-output hazard documented in
          #      linux_packaging_detect).
          command -v unzip >/dev/null \
            || { echo "unzip is not installed, so the .dbg leak assertion cannot run. Add it back to the container toolchain step - do not let this check silently no-op." >&2; exit 1; }
          nupkg_listing="$(unzip -l NtildeApp-0.0.1-ci-linux-x64-full.nupkg)"
          if grep -q '\.dbg' <<<"$nupkg_listing"; then
            echo "Ntilde.dbg leaked into the linux-x64 full nupkg" >&2
            exit 1
          fi

      # if: always() so a failure in the assertions above still leaves the produced
      # artifacts downloadable for triage. This upload is also the ONLY channel by
      # which the smoke job below receives them, so its name and the download step's
      # name must stay in sync.
      - name: Upload dry-run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-packaging-dryrun
          retention-days: 5
          path: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.nupkg
            artifacts/linux/releases.*.json

  # The docker half. Runs on the runner, NOT in a container, because both scripts
  # below start their own bare containers - see the block comment at the top of
  # this lane for why docker-in-docker is not an option. This is the release gate:
  # if it is ever skipped or made non-blocking, the lane has lost its point.
  linux_packaging_smoke:
    name: Linux Packaging (smoke)
    needs: [linux_packaging_detect, linux_packaging_build]
    if: >-
      needs.linux_packaging_detect.outputs.run == 'true' &&
      needs.linux_packaging_build.result == 'success'
    runs-on: ubuntu-latest
    # Two cold smoke containers that each apt-install their own tooling, plus the
    # test-build-deb.sh harness container. No compilation happens here.
    timeout-minutes: 30
    steps:
      # The scripts live in the repo, the artifacts come from the build job.
      - uses: actions/checkout@v4

      - name: Download dry-run artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packaging-dryrun
          path: artifacts/linux

      - name: Show downloaded artifacts
        run: ls -la artifacts/linux

      # fontconfig + x11-utils: test-build-deb.sh's own header comment documents
      # these as the donor-ELF providers (fc-match, xdpyinfo) its dedupe check
      # needs to be non-vacuous. Without them here, fc-match/xdpyinfo are absent
      # too, and the harness's donor search falls back to whatever imagemagick
      # happened to pull in transitively - which is exactly the "only
      # libfontconfig1 is discriminating" gap this list closes. binutils: strip's
      # preflight in build-deb.sh fails loudly without it.
      #
      # ubuntu:22.04 here, matching the build job's container: this harness runs
      # build-deb.sh, so it must see the same distro the real .deb was built on.
      - name: Test build-deb.sh
        run: |
          chmod +x packaging/linux/*.sh
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:22.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq file imagemagick fontconfig x11-utils binutils >/dev/null &&
             packaging/linux/test-build-deb.sh'

      - name: Smoke test (bare containers)
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/smoke-test.sh artifacts/linux

  # ===========================================================================
  # The Arch / AUR lane. Mirrors linux_packaging_smoke's shape - runner, no
  # `container:`, because smoke-test.sh starts its own containers as its entire
  # test premise and a `container:` job has no docker daemon to do that with.
  #
  # WHY IT TESTS A PUBLISHED RELEASE RATHER THAN THE DRY-RUN BUILD, unlike every
  # other job in this lane: the AUR package does not build Ntilde, it
  # repackages a published release tarball. That tarball IS its input. The
  # linux-packaging dry run produces a 0.0.1-ci .deb and AppImage but no tarball,
  # and a PKGBUILD generated at 0.0.1-ci would point at release URLs that do not
  # exist - so pointing this at the dry-run artifact would mean faking the one
  # thing the package actually consumes. Testing the newest stable release instead
  # exercises exactly what a user would install.
  #
  # The cost, stated plainly: this job depends on an external, moving input, so it
  # can fail for reasons outside the PR (a yanked release, a GitHub outage). That
  # is the trade - the alternative is a lane that never touches a real release
  # until the day it publishes one to the AUR.
  arch_packaging:
    name: Arch Packaging (AUR dry run)
    needs: [linux_packaging_detect]
    if: needs.linux_packaging_detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Three Arch containers that each pacman-install their own tooling, plus a
    # ~28 MB release download. Nothing is compiled.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, not just the branch: --source-ref resolves the release tag's blobs
          # via `git show`, and the default shallow checkout fetches no tags at all -
          # the generator would fail with "does not resolve in ...".
          fetch-depth: 0

      # In archlinux:base because of ONE tool: vercmp. Without it test-build-arch.sh
      # SKIPS its prerelease-ordering assertions - and those are precisely the ones
      # justifying why the Arch version mapping differs from the Debian lane's '~'.
      # Running these on the bare runner would pass while asserting nothing about the
      # thing most likely to be got wrong.
      - name: Generator tests
        run: |
          set -euo pipefail
          chmod +x packaging/arch/*.sh packaging/linux/*.sh
          docker run --rm -v "$PWD:/w:ro" -w /w archlinux:base bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed python git >/dev/null
            command -v vercmp >/dev/null || { echo "vercmp missing - the ordering assertions would silently skip" >&2; exit 1; }
            packaging/arch/test-build-arch.sh
          '

      - name: Resolve the newest published stable release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prereleases excluded on purpose: the AUR package tracks stable. The
          # generator maps a prerelease correctly (0.8.0-rc.1 -> 0.8.0rc1, ordered
          # below 0.8.0 - asserted in test-build-arch.sh), but publishing rcs to the
          # AUR would churn users, so this lane gates what actually ships.
          tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')"
          [[ -n "$tag" ]] \
            || { echo "::error::no published stable release to build an AUR package from" >&2; exit 1; }
          echo "Testing against $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # TRANSITIONAL (remove after the first Ntilde stable release ships): the rebrand
          # renamed the release assets and the packaging source files, so an end-to-end dry
          # run against a pre-rebrand release cannot pass. Skip with a warning instead of
          # failing the PR lane; test-build-arch.sh above still covers the generator.
          if gh release view "$tag" --json assets -q '.assets[].name' | grep -q '^ntilde-linux-x64-'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Newest stable release $tag predates the Ntilde rebrand (its assets are NovaTerminal-*, and its tree still has packaging/linux/nova.desktop). Skipping the end-to-end AUR dry run until the first Ntilde stable release; the generator unit tests above still ran."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release tarball
        if: steps.rel.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "ntilde-linux-x64-*.tar.gz" --dir artifacts/arch
          ls -la artifacts/arch
          test -f "artifacts/arch/ntilde-linux-x64-$TAG.tar.gz" \
            || { echo "::error::the x64 tarball is not named as expected for $TAG" >&2; exit 1; }

      # Generated INSIDE an Arch container rather than on the runner, for one
      # reason: makepkg. Off-Arch, build-arch.sh emits the PKGBUILD and skips
      # .SRCINFO with a note - and .SRCINFO is the file the AUR rejects a push
      # without, so generating it anywhere the real publish would not is how it
      # comes to be untested.
      #
      # AS AN UNPRIVILEGED USER, because makepkg refuses to run as root and a
      # container is root by default. The first CI run of this lane failed exactly
      # there. Same `useradd builder` shape smoke-test.sh uses for its makepkg phase.
      - name: Generate AUR sources
        if: steps.rel.outputs.skip != 'true'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          # QUOTED heredoc, with the tag reaching the container as DATA via a file read
          # with `read -r` - never interpolated into script text. The exposure here is
          # smaller than release.yml's (this tag comes from `gh release list` on this
          # repository, not from a dispatch input), but the rule is the same one this
          # repo already states for `run:` blocks: a tag is data, and generating shell
          # source from it is how it stops being data. Kept identical to release.yml so
          # neither becomes the exception someone later cites as precedent.
          printf '%s\n' "$TAG" > /tmp/gen-aur.args
          cat > /tmp/gen-aur.sh <<'EOF'
          set -euo pipefail
          IFS= read -r TAG < /gen.args
          [[ -n "$TAG" ]] || { echo "no tag passed into the container" >&2; exit 1; }
          # The checkout carries the runner user's uid, which builder is not; without
          # this, every git command refuses with "detected dubious ownership" and
          # --source-ref fails in a way that reads like a missing tag.
          git config --global --add safe.directory /w
          packaging/arch/build-arch.sh "$TAG" artifacts/aur --tarball "artifacts/arch/ntilde-linux-x64-$TAG.tar.gz" --source-ref "$TAG"
          EOF
          cat /tmp/gen-aur.sh
          # HOST_UID mapped for the same reason smoke-test.sh maps it: /w is a bind
          # mount, so what the container writes is owned by that uid on the host. This
          # lane only reads the result back, so a mismatch would not fail here - which
          # is exactly why it is worth matching release.yml, where the runner must
          # write into this directory and a stranger uid locks it out.
          docker run --rm -v "$PWD:/w" -v /tmp/gen-aur.sh:/gen.sh:ro -v /tmp/gen-aur.args:/gen.args:ro -w /w \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed git >/dev/null
            uid="${HOST_UID:-1000}"
            gid="${HOST_GID:-1000}"
            if [ "$uid" = "0" ]; then uid=1000; gid=1000; fi
            groupadd -g "$gid" builder 2>/dev/null || true
            useradd -m -u "$uid" -g "$gid" builder 2>/dev/null || useradd -m -u "$uid" builder
            mkdir -p /w/artifacts/aur
            chown -R "$uid":"$gid" /w/artifacts/aur
            su builder -c "bash /gen.sh"
          '
          # -s, not -f. A failed `makepkg --printsrcinfo > .SRCINFO` leaves a
          # ZERO-BYTE .SRCINFO behind, because the redirection creates the file
          # before makepkg ever runs - so `test -f` would pass on metadata that says
          # nothing. build-arch.sh now removes it on failure; this asserts that
          # outcome rather than trusting it.
          test -s artifacts/aur/PKGBUILD || { echo "::error::no PKGBUILD generated" >&2; exit 1; }
          test -s artifacts/aur/.SRCINFO || { echo "::error::no .SRCINFO generated (makepkg absent, or ran as root)" >&2; exit 1; }
          grep -q '^pkgbase = ntilde-bin$' artifacts/aur/.SRCINFO \
            || { echo "::error::.SRCINFO is not a ntilde-bin srcinfo" >&2; exit 1; }
          echo "--- PKGBUILD ---"; cat artifacts/aur/PKGBUILD
          echo "--- .SRCINFO ---"; cat artifacts/aur/.SRCINFO

      # The real gate: makepkg, then a pristine archlinux:base that installs the
      # package and nothing else, then an Xvfb launch. See packaging/arch/smoke-test.sh.
      - name: Smoke test (Arch containers)
        if: steps.rel.outputs.skip != 'true'
        run: |
          set -euo pipefail
          chmod +x packaging/arch/*.sh packaging/linux/*.sh
          packaging/arch/smoke-test.sh artifacts/aur

      # if: always() so a failure above still leaves the generated sources
      # downloadable for triage - they are small and are the first thing anyone
      # investigating this lane wants to read.
      - name: Upload generated AUR sources
        if: always() && steps.rel.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aur-dryrun
          retention-days: 5
          path: |
            artifacts/aur/PKGBUILD
            artifacts/aur/.SRCINFO
