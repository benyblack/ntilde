name: CI

on:
  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "documents/**"
      - "**/*.md"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# No job here writes to the repository: every step is build/test plus
# checkout/setup-dotnet/cache/upload-artifact, none of which touch GITHUB_TOKEN
# beyond reading the source. Grant the minimum and let any future job that needs
# more opt in with its own job-level `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Opt into Node.js 24 now; GitHub Actions will force this on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Prevent dotnet/MSBuild daemons from outliving each step and holding the
  # GitHub Actions runner's redirected stdout/stderr pipes open. Without these,
  # Linux Unit Tests has historically hung after tests completed because the
  # MSBuild worker pool spawned by `dotnet test` (and any nested `dotnet build`
  # inside tests like VtReportCliTests) kept the pipe alive past the step
  # timeout. UseSharedCompilation is also disabled globally via
  # Directory.Build.props, but these env vars cover the driver-level daemons
  # (MSBuild build server, MSBuild worker node reuse) that project files
  # cannot influence.
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  # Native FFI unit/integration tests (handle registry, abuse suite, alloc balance).
  # The per-OS build job only `cargo build`s the crates; the cargo test suites
  # (rusty_ssh fail-closed handle tests + rusty_pty cancel tests) run here.
  #
  # Runs on Windows as well as Linux: rusty_pty's ConPTY code is behind #[cfg(windows)], so its
  # tests - including the Win32 handle-leak regression test added for #120 - are compiled out
  # entirely on Linux and were never actually exercised by CI.
  rust-ffi-tests:
    name: Rust FFI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        # Third-party actions are pinned to full commit SHAs (githubactions:S7637).
        # The stable branch still resolves the latest stable toolchain at run time;
        # the SHA pins the action code, not the Rust version.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Rust incremental build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src/Ntilde.App/native
            src/Ntilde.App/native/rusty_ssh
      - name: rusty_ssh FFI tests (registry, abuse suite, alloc balance)
        run: cargo test --manifest-path src/Ntilde.App/native/rusty_ssh/Cargo.toml
      - name: rusty_pty FFI tests
        run: cargo test --manifest-path src/Ntilde.App/native/Cargo.toml

  # Single build job per OS: Rust native + .NET in one step.
  # Eliminates the artifact round-trip that the old build_native → build_dotnet split required.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # MUST STAY IDENTICAL to build_and_unit_tests' matrix below, which explains why
        # each platform is in which trigger. It is not stylistic: that job downloads
        # `dotnet-build-${{ matrix.os }}` from this one, so a platform present there and
        # absent here fails at artifact download rather than anywhere informative.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest","ubuntu-24.04-arm"]' || github.event_name == 'schedule' && '["windows-latest","ubuntu-latest","ubuntu-24.04-arm"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      # Both wrappers refuse to run on a toolchain that cannot compile, because the host does
      # not reliably say so itself: an unresolvable global.json pin has been seen printing "A
      # compatible .NET SDK was not found" and exiting 0 (#347), which used to reach CI steps
      # and && chains as a success for a build that produced nothing. Every instruction in
      # CLAUDE.md routes through these scripts, so this is the exit code the project's tooling
      # rests on, and it is worth a couple of seconds to know it still works on both shells.
      # Runs against a stub dotnet, so it needs no SDK and is placed before the toolchain setup.
      - name: Self-test the build wrappers' SDK guard
        shell: bash
        run: |
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          "$py" scripts/tests/build_wrapper_sdk_guard_tests.py

      # ── Rust native ────────────────────────────────────────────────────────────
      # Cache the compiled binary keyed on all Rust source files.
      # On a hit the toolchain install, Swatinem, and cargo build are all skipped.
      # Cache both target/release and target_linux/release: the Linux csproj
      # consumes the .so from target_linux/release, so it must be part of the
      # cache or a cache hit leaves the staged path empty and the Build step
      # below is skipped. The v2 bump invalidated older caches that contained only
      # target/release; the v3 bump on the key itself is explained there.
      - name: Cache native binary
        id: native-bin-cache
        uses: actions/cache@v4
        with:
          path: |
            src/Ntilde.App/native/target/release
            src/Ntilde.App/native/target_linux/release
          # Key version bumped to v3 for the rusty_pty input-hash stamp
          # (native/target/release/.nova-rust-inputs.sha256). A v2 payload predates the stamp,
          # so restoring one would make BuildRustNative call the binary stale and invoke cargo -
          # on a runner where this same cache hit skipped the toolchain install and the cargo
          # registry cache. Worse, actions/cache does not re-save on an exact key hit, so the
          # stamp would never enter the v2 payload and every hit would pay that rebuild forever.
          # Bumping forces one miss, whose save captures the stamp.
          key: native-bin-v3-${{ matrix.os }}-${{ hashFiles('src/Ntilde.App/native/src/**', 'src/Ntilde.App/native/Cargo.toml', 'src/Ntilde.App/native/Cargo.lock') }}

      - name: Install Rust
        if: steps.native-bin-cache.outputs.cache-hit != 'true'
        # Third-party actions are pinned to full commit SHAs (githubactions:S7637).
        # The stable branch still resolves the latest stable toolchain at run time;
        # the SHA pins the action code, not the Rust version.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust incremental build cache
        if: steps.native-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/Ntilde.App/native

      - name: Build Rust (Windows)
        if: runner.os == 'Windows' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: cd src/Ntilde.App/native && cargo build --release --locked

      # Linux build also stages the .so into target_linux/release so the
      # cached payload is complete and no separate stage step is needed.
      - name: Build Rust (Linux)
        # runner.os, not `matrix.os == 'ubuntu-latest'`. Selecting on an exact runner
        # LABEL means every new Linux label is silently not-Linux: ubuntu-24.04-arm
        # matched no Build Rust step at all, so the job sailed past with no native
        # library and would have failed later, somewhere unrelated.
        if: runner.os == 'Linux' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: |
          cd src/Ntilde.App/native
          cargo build --release --locked
          mkdir -p target_linux/release
          cp target/release/librusty_pty.so target_linux/release/

      - name: Build Rust (macOS)
        if: runner.os == 'macOS' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: cd src/Ntilde.App/native && cargo build --release --locked

      # ── .NET ───────────────────────────────────────────────────────────────────
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # Upload only the test output directories. src/*/bin/ is 100% duplicated inside
      # tests/Ntilde.App.Tests/bin/ (MSBuild copies all referenced DLLs + executables),
      # so including it would double the artifact size for no benefit.
      # VtReportCliTests needs src/Ntilde.App/bin/ at runtime — the unit test
      # job restores it from the test output via a symlink/junction (see below).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          retention-days: 1
          # upload-artifact@v4 strips the longest common ancestor of all paths, so
          # "tests/" is stripped from both entries here. All download-artifact steps
          # compensate by specifying path: tests to restore the prefix.
          path: |
            tests/Ntilde.App.Tests/bin/${{ env.CONFIGURATION }}
            tests/Ntilde.Platform.Tests/bin/${{ env.CONFIGURATION }}
            tests/Ntilde.Architecture.Tests/bin/${{ env.CONFIGURATION }}
            tests/Ntilde.VT.Tests/bin/${{ env.CONFIGURATION }}
            tests/Ntilde.Rendering.Tests/bin/${{ env.CONFIGURATION }}
            tests/Ntilde.McpServer.Tests/bin/${{ env.CONFIGURATION }}

  build_and_unit_tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # Same dispatch-conditional shape as `build` above, and for the same reason: macOS is
        # not worth the minutes on every PR, but it must be reachable WITHOUT cutting a
        # release. Until now `build` compiled on macOS while nothing ever ran the tests there,
        # so macOS's only test coverage was release.yml's release_tests — meaning a
        # macOS-only defect could surface exactly once, at release time, where it blocks the
        # release. That is how #325's port-forward backpressure test went three months
        # unverified on macOS and then failed the first release that ran it.
        #
        # ubuntu-24.04-arm is here for EXACTLY that reason, having cost exactly that way
        # a second time. Linux arm64 had no test coverage outside release.yml's
        # release_tests, so KittyFrameRetirementTests' millisecond-boundary race (#458)
        # sat on main for five days, unreachable by any pull request, and surfaced only
        # because a scratch release was dispatched to test something unrelated. Same
        # shape as #325, same cost: a platform-only defect that can only be discovered
        # at the moment it blocks a release.
        #
        # ON SCHEDULE AS WELL AS DISPATCH, and that is the difference from macOS above.
        # Dispatch-only makes a platform *reachable*; it does not make it *checked*,
        # because it still waits for someone to think of running it - which for arm64
        # nobody did. The nightly cron already exists, so the same defect would now be
        # caught within a day instead of at the next release. Still not on pull requests:
        # a PR-blocking leg on every push is a different cost decision, and this one is
        # already the cheap 95% of the value.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest","ubuntu-24.04-arm"]' || github.event_name == 'schedule' && '["windows-latest","ubuntu-latest","ubuntu-24.04-arm"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          # upload-artifact@v4 strips the longest common ancestor of all uploaded paths.
          # Both uploaded paths share "tests/" so it gets stripped inside the zip.
          # Downloading to "tests" restores the expected tests/* structure.
          path: tests

      # zip artifacts don't preserve Unix execute bits; restore them so the test host and
      # any app/CLI binaries referenced by tests (Ntilde.App, Ntilde.Cli) can run.
      #
      # Every POSIX runner needs this, not just Linux. While this job was windows+ubuntu only,
      # "Linux" and "not Windows" were the same set; adding macOS separated them, and macOS
      # skipping it failed the whole job with "Win32Exception (13) ... Permission denied" trying
      # to launch the xunit v3 test host. `-exec … +` rather than `| xargs`, because xargs with
      # no matches still invokes chmod with no operands, which fails on BSD/macOS.
      - name: Restore execute permissions (POSIX)
        if: runner.os != 'Windows'
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            -exec chmod +x {} +

      # VtReportCliTests.cs looks for app/CLI binaries in src/*/bin/Release/net10.0/.
      # Every file there is already present in the test output (MSBuild copies all
      # referenced DLLs and the host executable), so we mirror it locally with
      # hardlinks (Linux) or robocopy (Windows) instead of duplicating 1.1 GB in
      # the artifact. Local disk copy is fast; network upload/download is not.
      - name: Reconstruct src bin dirs from test output (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src/Ntilde.App/bin/Release src/Ntilde.Cli/bin/Release
          cp -rl tests/Ntilde.App.Tests/bin/Release/net10.0 src/Ntilde.App/bin/Release/net10.0
          cp -rl tests/Ntilde.App.Tests/bin/Release/net10.0 src/Ntilde.Cli/bin/Release/net10.0

      - name: Reconstruct src bin dirs from test output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "tests\Ntilde.App.Tests\bin\Release\net10.0"
          # robocopy exits 0 (nothing to copy) or 1 (files copied) on success; >=8 is an error
          foreach ($dst in @("src\Ntilde.App\bin\Release\net10.0", "src\Ntilde.Cli\bin\Release\net10.0")) {
            robocopy $src $dst /E /NJH /NJS /NFL /NDL /NC /NS | Out-Null
            if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Restore
        run: dotnet restore

      # The shell-integration tests under tests/Ntilde.App.Tests/CommandAssist/ShellIntegration/Integration
      # spawn real bash/zsh/fish via the production PTY path. bash is
      # preinstalled on ubuntu-latest; zsh and fish are not on ubuntu-24.04,
      # so install them here -- otherwise ZshShellIntegrationTests and
      # FishShellIntegrationTests skip instead of running.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # Gating lane: the non-headless test projects. These are deterministic and
      # MUST pass. The filter drops the lanes that run in their own jobs (replay,
      # render-metrics, pty-smoke, stress, golden-shared-png).
      - name: Test (unit — gating, non-headless projects)
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          set -e
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          for proj in VT Rendering Architecture Platform McpServer; do
            echo "::group::Ntilde.$proj.Tests"
            dotnet test "tests/Ntilde.$proj.Tests" -c "$CONFIGURATION" --no-build --no-restore \
              --filter "$filter" --logger "trx;LogFileName=unit_${proj}.trx"
            echo "::endgroup::"
          done

      # The Avalonia-headless suite (Ntilde.App.Tests). continue-on-error here tolerates
      # the HANG only; test failures are blocking, via the allowlist gate below.
      #
      # The hang was long recorded here as an upstream framework deadlock — AvaloniaUI/Avalonia#21467,
      # tracked as #81 — that no in-repo change could fix. That was wrong, and it is worth being
      # precise about why, because believing it is what kept anyone from reading a dump for months.
      # Four hang dumps all showed the same thing: our own Command Assist pass, still in flight from
      # a finished test, read Avalonia's mutable Dispatcher.UIThread static from a threadpool thread
      # and became the UI thread. The next test's Compositor then threw inside
      # EnsureIsolatedApplication(), which sits outside the try in HeadlessUnitTestSession.DispatchCore,
      # unwinding the one dispatcher loop the assembly shares — after which every remaining test
      # blocks forever and the trx reports nothing. PR #416 fixed the read; #417 removed the leaked
      # panes that fed the same contamination. TerminalPane.InitializeCommandAssist has the full
      # account.
      #
      # continue-on-error stays for now anyway, because the claim that replaced the old one has to
      # earn its keep the same way: a handful of green runs is not evidence that no hang remains.
      # Revisit by counting hang-dump uploads on main over a few dozen runs; when they stop, drop
      # continue-on-error from both test steps and delete the hang-dump branch in
      # check-app-tests-baseline.py.
      #
      # continue-on-error covers the HANG, not the RESULTS. The results are gated by the
      # step below, because "non-blocking" silently became "unread": this job reported
      # success for weeks while 16 tests failed on Windows and 14 on ubuntu.
      - name: Test (headless App.Tests — hang-tolerant, failures gated below; #81 / AvaloniaUI/Avalonia#21467)
        continue-on-error: true
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          mkdir -p tests/Ntilde.App.Tests/TestResults/main
          # tee, because xUnit's "Catastrophic failure" aborts exist only in this output: they
          # kill a whole collection without writing a result, so the trx cannot report them and
          # the gate has to read the log to see them at all.
          set -o pipefail
          dotnet test tests/Ntilde.App.Tests -c "$CONFIGURATION" --no-build --no-restore \
            --filter "Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng&Lane!=PlatformBoot" \
            --blame-hang-timeout 5m --blame-hang-dump-type mini \
            --results-directory tests/Ntilde.App.Tests/TestResults/main \
            --logger "trx;LogFileName=unit_app.trx" \
            2>&1 | tee tests/Ntilde.App.Tests/TestResults/main/console.log

      # Lane!=PlatformBoot above, Lane=PlatformBoot here: these run in a SEPARATE PROCESS on
      # purpose, and the split is the fix for a real bug rather than tidiness.
      #
      # SnapshotService.EnsureAvaloniaInitialized boots the Avalonia headless platform so the
      # snapshot renderer can resolve fonts. Its callers are plain [Fact] tests, so the boot runs
      # on an arbitrary xUnit thread, and it binds a thread-affine MediaContext into the
      # process-global AvaloniaLocator root. Locator scopes fall through to their parent on a
      # miss, so every later [AvaloniaFact] in the same process inherits a context owned by the
      # wrong thread and throws "The calling thread cannot access this object because a different
      # thread owns it" on the first transition it applies — 13 failures across four unrelated
      # classes, order-dependent, green in isolation, and invisible because this job reported
      # success. Two in-process fixes were tried and both swapped the failures for a hang; see
      # SnapshotService.EnsureAvaloniaInitialized. Not sharing the process is what works.
      - name: Test (headless App.Tests, PlatformBoot lane — hang-tolerant, failures gated below)
        continue-on-error: true
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          mkdir -p tests/Ntilde.App.Tests/TestResults/platformboot
          set -o pipefail
          dotnet test tests/Ntilde.App.Tests -c "$CONFIGURATION" --no-build --no-restore \
            --filter "Lane=PlatformBoot&Category!=GoldenSharedPng" \
            --blame-hang-timeout 5m --blame-hang-dump-type mini \
            --results-directory tests/Ntilde.App.Tests/TestResults/platformboot \
            --logger "trx;LogFileName=unit_app_platformboot.trx" \
            2>&1 | tee tests/Ntilde.App.Tests/TestResults/platformboot/console.log

      # Gates the lane above on its own results: any failing test not named in
      # tests/app-tests-known-flaky.txt fails this job, as does a runner-level abort in the
      # console log — those kill a whole collection without writing a result, so the trx
      # cannot see them. A missing trx is the #81 hang and only warns; there are no results to
      # judge, and that hang is the one thing this lane exists to tolerate. Runs on failure
      # too, so a non-zero `dotnet test` still gets its results read.
      # The gate decides whether this lane may report success, so its own branching is worth
      # a second of CI: the truncation and abort rules are what stop another green-but-broken
      # run, and getting them backwards would either red every PR or hide the next one.
      - name: Self-test the App.Tests gate
        if: always()
        shell: bash
        run: |
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          "$py" scripts/tests/check_app_tests_baseline_tests.py

      - name: Check App.Tests failures against the flake allowlist
        if: always()
        shell: bash
        run: |
          # windows-latest ships python.exe; ubuntu ships python3. Pick whichever exists.
          py=python3
          command -v "$py" >/dev/null 2>&1 || py=python
          # Each lane has its own results directory, and that is load-bearing rather than tidy:
          # the gate tells "hung" from "crashed" by whether a hang dump sits beside the trx, so
          # with one shared TestResults/ each lane would see the other's dump. That reported the
          # PlatformBoot lane as truncated when it had finished cleanly, and would have let a
          # leftover dump excuse a genuine crash in the other lane.
          # The third field is the lane's floor for executed tests. A run below it that did not
          # hang is rejected rather than summarised: 0962be8 executed 1,112 of 3,434 here, lost
          # the rest to collection aborts, and reported "no failures" on a green job. The floors
          # sit next to the --filter arguments above because changing a filter is what
          # legitimately changes a count - and lowering one should be as deliberate as adding a
          # line to the flake allowlist. Headroom is for OS skip differences (windows and ubuntu
          # differ by a handful) and small churn, not for losing collections.
          status=0
          for lane in main:unit_app:3300 platformboot:unit_app_platformboot:40; do
            dir="${lane%%:*}"
            rest="${lane#*:}"
            trx="${rest%%:*}"
            floor="${rest##*:}"
            echo "::group::$trx"
            "$py" scripts/check-app-tests-baseline.py \
              "tests/Ntilde.App.Tests/TestResults/$dir/$trx.trx" \
              tests/app-tests-known-flaky.txt \
              "$floor" \
              "tests/Ntilde.App.Tests/TestResults/$dir/console.log" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # runner.arch too, now that two legs of this matrix are Linux. Both would
          # otherwise upload "unit-tests-Linux".
          #
          # Measured rather than assumed, because the documented behaviour and the observed
          # behaviour disagree: upload-artifact v4's README says names must be unique and a
          # second upload fails, but the dispatch that verified this PR produced TWO
          # artifacts both named unit-tests-Linux (1215997 and 1216570 bytes), and both legs
          # went green. So this is not fixing a red build.
          #
          # It is fixing an ambiguous one. These artifacts exist solely so a human can read
          # the trx, the blame-hang minidump and the tee'd console log after a failure - and
          # two same-named artifacts mean whoever downloads "unit-tests-Linux" gets one of
          # the two architectures with no way to tell which. Evidence you cannot attribute
          # is barely evidence.
          name: unit-tests-${{ runner.os }}-${{ runner.arch }}
          retention-days: 5
          # *.dmp captures the blame-hang minidump on a teardown hang (#81). console.log is
          # the tee'd App.Tests output, and it is here because it is the only place a
          # runner-level abort exists: those now fail the gate, so the evidence for a red run
          # has to outlive the job log rather than being buried in it.
          path: |
            **/*.trx
            **/*.dmp
            **/TestResults/*/console.log

  # Native SSH end-to-end against a real sshd in a container.
  #
  # These tests existed before this job did, and never ran anywhere: every one is a
  # [DockerFact], which self-skips unless NTILDE_ENABLE_DOCKER_E2E=1, and nothing in CI set
  # it. The suite was written, committed, skipped, and counted as coverage — which is why the
  # test matrix still listed auth, host-key and forwarding as "pending manual" while a
  # Dockerized suite sat next to it. This job is what makes the difference between the two
  # visible.
  #
  # Deliberately blocking rather than continue-on-error. A non-blocking lane here would repeat
  # the mistake #127 caught in the Render Metrics job: a check whose name claims coverage it
  # does not enforce. If it turns flaky, the fix is to stabilise the fixture, not to silence
  # the gate.
  #
  # Linux only: the tests drive `docker` through the CLI, and ubuntu-latest is the runner image
  # with a working Linux Docker daemon. The Windows runners would need Linux-container support
  # that is not available there, and nothing under test is platform-specific — the fixture
  # exercises the same rusty_ssh library either way.
  native_ssh_docker_e2e:
    name: Native SSH Docker E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-ubuntu-latest
          path: tests

      # zip artifacts drop Unix execute bits; the test host needs them back. librusty_ssh.so
      # travels in this artifact too (Platform.Tests copies it as Content), so the P/Invoke
      # surface these tests exercise is already in place — no Rust rebuild needed.
      - name: Restore execute permissions
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            | xargs chmod +x

      - name: Docker preflight
        run: docker info --format 'server={{.ServerVersion}}'

      - name: Restore
        run: dotnet restore

      # The fixture builds the image itself on first use (DockerSshFixture.EnsureImageBuiltAsync),
      # so there is no separate build step here; a failure to build surfaces as a test failure
      # with the docker output attached.
      - name: Test (native SSH Docker E2E)
        env:
          NTILDE_ENABLE_DOCKER_E2E: '1'
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          dotnet test tests/Ntilde.Platform.Tests -c "$CONFIGURATION" --no-build --no-restore \
            --filter "Category=DockerE2E" \
            --logger "trx;LogFileName=native_ssh_docker_e2e.trx"

      # No "collect container logs" step on purpose: the fixture runs containers with --rm and
      # removes them in DisposeAsync, which still executes when a test fails, so by the time a
      # post-step ran there would be nothing left to read. The diagnostics live where they are
      # actually available instead — DockerSshFixture attaches `docker logs` output to the
      # readiness timeouts it throws, so the failure reaches the .trx with the logs in it.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ssh-docker-e2e
          retention-days: 5
          path: "**/native_ssh_docker_e2e.trx"

  # Coverage measurement (#117). coverlet.collector was pinned in
  # Directory.Packages.props and referenced by all five test projects, but nothing ever
  # enabled it - no invocation passed a collect switch and no report was produced.
  #
  # Deliberately a separate job rather than instrumenting the gating Unit Tests lane.
  # Coverage instrumentation slows execution by orders of magnitude on hot loops, and the
  # suite contains wall-clock assertions - CsiParamClampTests.HugeCsiParameter_DoesNotHang
  # guards the #124 parser DoS with a 2s ceiling, and measured 2088ms under instrumentation
  # locally. Instrumenting the gate would make the gate's own timing assertions unreliable,
  # so correctness and measurement are kept apart.
  # Formatting was previously checked only by ci/run.{ps1,sh}, and those were deliberately
  # report-only because main carried 674 pre-existing whitespace violations. Nothing in
  # GitHub CI looked at formatting at all, so the count drifted upward unnoticed (649 -> 674
  # over two weeks with nobody working on it). #216 swept the backlog; this job is the half
  # that stops it re-accumulating.
  #
  # Runs on both OSes on purpose. `.editorconfig` requires CRLF while git stores LF, so
  # before `.gitattributes` pinned the checkout this check reached a different verdict per
  # platform. The ubuntu leg is what proves that pinning works.
  #
  # Scoped to `whitespace`: a bare `dotnet format` also runs the style and analyzer passes,
  # whose diagnostics belong to #108. Mixing them would make this gate fail for reasons
  # unrelated to formatting.
  format:
    name: Format (whitespace)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

  coverage:
    name: Coverage (Ntilde.VT floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      # Builds from source rather than consuming the build job's artifact. Two reasons:
      #
      # 1. `dotnet test <dir> --no-build --settings <file>` silently does nothing on this
      #    SDK - it exits 0 in ~0.3s with no output and writes no report, five times over.
      #    The gating lane gets away with the same --no-build because it passes no
      #    --settings. Building here matches the invocation shape that was verified to
      #    produce a report locally, instead of relying on that combination working.
      # 2. Coverage needs the source tree anyway to attribute lines, so the artifact saved
      #    nothing here.
      #
      # The cost is one extra build in exchange for a job that demonstrably measures.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # continue-on-error: this job measures, it does not judge correctness - the Unit Tests
      # lane already does that on an uninstrumented run. Without this, a wall-clock
      # assertion tripped by instrumentation overhead (see the job comment) would fail here
      # for a reason that says nothing about the code. Coverage data is still written for
      # every test that ran, so the floor check below remains meaningful.
      - name: Test with coverage
        continue-on-error: true
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          # No `|| true` inside the loop. The step is already continue-on-error, so
          # swallowing exit codes there only destroys the diagnostics - which is exactly
          # what happened on the first attempt: five empty log groups and no way to tell
          # why. set -x records the resolved command so a failure explains itself.
          set -x
          dotnet --version
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          # Which projects are measured, and why these:
          #
          # Architecture.Tests is deliberately absent. It has no coverlet.collector
          # reference (unlike the four below), so it produced no report and the job
          # measured four projects while listing five. It asserts project and IL structure
          # rather than executing product code, so there is little for coverlet to
          # attribute - excluding it is more honest than adding the package to make an
          # empty report appear.
          #
          # App.Tests is also absent, matching the gating lane, which excludes it because
          # of the Avalonia headless flake (#81). It does carry the collector, and it
          # exercises a lot of VT (the buffer and reflow scenario suites live there) - so
          # its absence is the main reason the VT figure below understates true coverage.
          for proj in VT Rendering Platform McpServer; do
            echo "::group::Ntilde.$proj.Tests"
            dotnet test "tests/Ntilde.$proj.Tests" -c "$CONFIGURATION" --no-restore \
              --filter "$filter" \
              --settings tests/coverage.runsettings \
              --results-directory "coverage/$proj"
            echo "::endgroup::"
          done
          echo "=== collected reports ==="
          find coverage -name '*.cobertura.xml' -print || echo "none found"

      # A floor, not a target, and deliberately below the measured value: VT is at 53.14%
      # line / 46.51% branch as measured by this invocation, so the floor is 50% - normal
      # churn cannot turn a green PR red, and it should be ratcheted up as coverage grows
      # rather than set aspirationally now. VT gets the only floor because it is the
      # conformance-critical assembly; the other four upload their reports so their numbers
      # are visible before anyone commits to a floor for them.
      - name: Check coverage floor (Ntilde.VT)
        shell: pwsh
        run: >-
          ./scripts/check-coverage.ps1
          -ReportDirectory coverage/VT
          -MinimumLinePercent 50
          -Label Ntilde.VT

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          retention-days: 5
          path: coverage/**/*.cobertura.xml

  golden_shared_png_tests:
    name: Golden Shared PNGs (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.dotnet
          # runner.arch, not just runner.os. `runner.os` is "Linux" for BOTH
          # ubuntu-latest (x64) and ubuntu-24.04-arm, so without the arch an arm64
          # runner restores the x64 SDK the x64 runner saved and dies on the first
          # exec with `/home/runner/.dotnet/dotnet: 1: ELF: not found` - a message
          # that names neither the cache nor the architecture. Found the moment the
          # arm64 leg first ran.
          key: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        id: download_golden_build_artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dotnet-build-windows-latest
          path: tests

      - name: Reset partial artifact download
        if: steps.download_golden_build_artifact.outcome == 'failure'
        shell: pwsh
        run: |
          Remove-Item tests\Ntilde.App.Tests\bin -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item tests\Ntilde.Platform.Tests\bin -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download build artifact (retry)
        if: steps.download_golden_build_artifact.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-windows-latest
          path: tests

      - name: Restore
        run: dotnet restore

      - name: Run Golden Shared PNG Tests
        run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --no-restore --filter "Category=GoldenSharedPng" --blame-hang-timeout 8m --blame-hang-dump-type none --logger "trx;LogFileName=golden_shared_png_tests.trx"

      - name: Upload golden shared PNG test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-shared-png-tests-windows
          retention-days: 5
          path: "**/*golden_shared_png_tests.trx"

