name: VT Conformance

on:
  pull_request:
    paths:
      - "docs/vt_coverage_matrix.md"
      - "docs/ghostty-gaps/vt_conformance_tooling.md"
      - "src/Ntilde.App/Resources/vt-conformance-report.json"
      - "src/Ntilde.Conformance/**"
      - "src/Ntilde.VtContract/**"
      - "tests/Ntilde.VT.Tests/VtCapabilityContractTests.cs"
      # Parser/buffer changes can invalidate matrix claims even when the matrix
      # itself is untouched, so run the gate for them too (#156).
      - "src/Ntilde.VT/**"
      - ".github/workflows/vt-conformance.yml"
  push:
    branches: [main]
    paths:
      - "docs/vt_coverage_matrix.md"
      - "docs/ghostty-gaps/vt_conformance_tooling.md"
      - "src/Ntilde.App/Resources/vt-conformance-report.json"
      - "src/Ntilde.Conformance/**"
      - "src/Ntilde.VtContract/**"
      - "tests/Ntilde.VT.Tests/VtCapabilityContractTests.cs"
      - "src/Ntilde.VT/**"
      - ".github/workflows/vt-conformance.yml"
  workflow_dispatch:

# The matrix gate only reads the checkout and fails the run; it never comments on
# the PR or pushes. See the note in ci.yml.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  validate:
    name: Validate VT Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore conformance tool
        run: dotnet restore src/Ntilde.Conformance/Ntilde.Conformance.csproj

      - name: Build conformance tool
        run: dotnet build src/Ntilde.Conformance/Ntilde.Conformance.csproj -c ${{ env.CONFIGURATION }} --no-restore

      - name: Validate matrix and generate report
        run: dotnet run --project src/Ntilde.Conformance/Ntilde.Conformance.csproj -c ${{ env.CONFIGURATION }} --no-build -- --validate --report artifacts/vt-conformance/vt-conformance-report.json

      - name: Validate embedded app report is current
        run: dotnet run --project src/Ntilde.Conformance/Ntilde.Conformance.csproj -c ${{ env.CONFIGURATION }} --no-build -- --validate --check-report src/Ntilde.App/Resources/vt-conformance-report.json

      - name: Upload VT conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vt-conformance-report
          retention-days: 5
          path: artifacts/vt-conformance/vt-conformance-report.json
