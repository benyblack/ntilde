# Inline tables and 0x hex, both valid Alacritty.
[colors.primary]
background = '0x101010'
foreground = '0xe0e0e0'

[colors.cursor]
text = '0x101010'
cursor = '0xe0e0e0'

[colors]
selection = { text = '0xffffff', background = '0x335577' }

[colors.search]
matches = { foreground = '0x000000', background = '0xaaaa00' }
focused_match = { foreground = '0x000000', background = '0xff8800' }
