[package]
name = "rusty_ssh"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
libc = "0.2"
russh = { version = "0.59.0", default-features = false, features = ["ring"] }
russh-sftp = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48.0", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
# Wipes credential buffers on drop. Already present transitively via russh/ring;
# declared directly because this crate uses Zeroizing in its own auth paths.
zeroize = "1.8"

[dev-dependencies]
# `macros` for #[tokio::test]; `test-util` for start_paused, which lets the forward-channel teardown
# test advance past FORWARD_CHANNEL_DRAIN_TIMEOUT instantly instead of sleeping two real seconds.
# Dev-only: neither feature reaches the cdylib the app loads.
tokio = { version = "1.48.0", features = ["macros", "rt", "test-util", "time"] }
# The agent-auth tests run russh's own agent *server* in-process, whose serve() accepts the
# connection listener as a futures Stream. Already in the tree via russh; dev-only here.
futures = "0.3"
