[package]
name = "rusty_pty"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib: the App loads rusty_pty.dll / librusty_pty.so / librusty_pty.dylib beside its executable.
# staticlib: ntilde-mux links librusty_pty.a into its single-file NativeAOT binary
# (docs/superpowers/specs/2026-10-05-ntilde-mux-phase4.md §2 decision 1, §10.1).
crate-type = ["cdylib", "staticlib"]

[dependencies]
portable-pty = "0.9"
libc = "0.2"
anyhow = "1.0"
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Pipes", "Win32_System_IO"] }
